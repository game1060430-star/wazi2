<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Wazi 管理系統 V23.15</title>
    <style>
        .recon-layout {display:grid;grid-template-columns:180px minmax(0,1fr);gap:10px;}
        .recon-toolbar {display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:10px 0;}
        .recon-toolbar button {width:auto;padding:9px;}
        .recon-row {display:grid;grid-template-columns:24px minmax(0,1fr) auto;gap:8px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);}
        .vendor-terms {display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0;}
        @media(max-width:640px){.recon-layout{grid-template-columns:1fr;}#reconVendorList{display:flex;flex-wrap:wrap;gap:10px;}.recon-row input[type=number]{max-width:110px;}}
        .feature-box {padding:10px; margin-bottom:10px; border:1px solid var(--line); border-radius:10px;}
        .settlement-info {border-top:1px solid var(--line); margin-top:10px; padding-top:10px; font-size:13px; line-height:1.6;}
        * { box-sizing: border-box; font-family: "Microsoft JhengHei", sans-serif; }
        :root {
            --bg: #f3f5f2;
            --card: #ffffff;
            --text: #26322d;
            --muted: #728078;
            --line: #e2e8e1;
            --primary: #4f7d5f;
            --primary-dark: #356247;
            --accent: #bf6f45;
            --danger: #c94f4f;
            --info: #3c7f99;
        }
        body { background: var(--bg); margin: 0; padding: 10px; color: var(--text); font-size: 14px; }
        .container { max-width: 850px; margin: 0 auto; }
        .card { background: var(--card); border: 1px solid rgba(53,98,71,0.08); border-radius: 10px; padding: 15px; margin-bottom: 12px; box-shadow: 0 4px 14px rgba(38,50,45,0.07); }
        .tabs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 12px; }
        .tab-btn { padding: 12px 2px; background: #e5ebe4; border: 1px solid #d8e1d6; border-radius: 8px; color: var(--text); font-weight: bold; cursor: pointer; font-size: 13px; transition: 0.2s; }
        .tab-btn.active { background: var(--primary); border-color: var(--primary); color: white; box-shadow: 0 3px 10px rgba(79,125,95,0.25); }
        .tab-btn.refresh-btn { background: var(--info); border-color: var(--info); color: white; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        .date-picker-wrap { background: #e5ebe4; border-radius: 10px; padding: 10px; display: flex; justify-content: center; align-items: center; margin-bottom: 12px; border: 1px solid #d8e1d6; }
        .date-picker-wrap input { background: transparent; border: none; font-size: 18px; font-weight: bold; text-align: center; width: 100%; outline: none; cursor: pointer; color: var(--text); }
        .form-group { margin-bottom: 10px; }
        .form-group label { display: block; font-size: 11px; color: var(--muted); margin-bottom: 4px; font-weight: bold; }
        .form-group input, .form-group select, .form-group textarea { width: 100%; padding: 10px; border: 1px solid var(--line); border-radius: 8px; font-size: 16px; text-align: center; background: #fbfcfb; color: var(--text); }
        .form-group input:focus, .form-group select:focus, .form-group textarea:focus { outline: 2px solid rgba(79,125,95,0.22); border-color: var(--primary); background: #fff; }
        .form-group textarea { min-height: 84px; resize: vertical; text-align: left; }
        .check-row { display: flex; align-items: center; gap: 8px; min-height: 42px; font-weight: bold; color: var(--text); }
        .check-row input { width: 20px; height: 20px; accent-color: var(--primary); }
        .list-row { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 8px 0; border-bottom: 1px solid #eee; }
        .list-row button { width: auto; min-width: 48px; padding: 6px 10px; margin: 0; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .btn { width: 100%; padding: 12px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; margin-top: 5px; display: flex; align-items: center; justify-content: center; gap: 5px; }
        .btn-success { background: var(--primary); color: white; }
        .btn-primary { background: #4e78b8; color: white; }
        .btn-danger { background: var(--danger); color: white; }
        .btn-warning { background: var(--accent); color: white; }
        .btn-info { background: var(--info); color: white; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 12px; }
        table th, table td { border: 1px solid var(--line); padding: 8px; text-align: center; }
        table th { background: #eef4ec; color: var(--primary-dark); }
        .section-title { border-left: 4px solid var(--primary); padding-left: 8px; margin: 15px 0 10px; font-size: 15px; font-weight: bold; background: #eef4ec; padding: 7px 8px; border-radius: 6px; }
        .profit-box { font-size: 20px; font-weight: bold; text-align: center; padding: 15px; background: var(--primary-dark); color: #fff; border-radius: 8px; margin-top: 10px; }
        .stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 10px; }
        .stat-card { background: #fbfcfb; border: 1px solid var(--line); padding: 10px; border-radius: 8px; text-align: center; }
        .stat-card b { font-size: 16px; color: var(--primary-dark); }
        .calc-hint { font-size: 11px; color: var(--danger); text-align: right; min-height: 15px; font-weight: bold; }
        .total-row { background: #eef4ec; font-weight: bold; }
        .grand-total-row { background: #fff4ee; font-weight: bold; color: #a9472f; }
        .mobile-stack { display: grid; grid-template-columns: 1fr; gap: 8px; }
        .v-row { background: #fff; border: 1px solid var(--line); border-radius: 10px; padding: 10px; box-shadow: 0 2px 8px rgba(38,50,45,0.04); }
        .v-row b { display: block; margin-bottom: 6px; font-size: 13px; text-align: center; }
        .vendor-item-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
        .vendor-item-grid label { display: block; margin-bottom: 4px; color: var(--muted); font-size: 11px; font-weight: bold; text-align: center; }
        .misc-list { margin-top: 8px; }
        .misc-row { display: grid; grid-template-columns: 1fr auto auto auto; gap: 8px; align-items: center; padding: 8px 0; border-bottom: 1px solid #eee; }
        .misc-row button { width: auto; min-width: 48px; padding: 6px 10px; margin: 0; }
        .mode-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 10px; }
        .mode-btn { border: 1px solid var(--line); background: #fbfcfb; color: var(--text); border-radius: 8px; padding: 10px; font-weight: bold; }
        .mode-btn.active { background: var(--primary); color: #fff; border-color: var(--primary); }
        .report-card { overflow: visible; }
        .report-note { color: var(--muted); font-size: 12px; line-height: 1.5; margin: 4px 0 10px; }
        .save-toast { position: fixed; left: 50%; bottom: 18px; transform: translate(-50%, 20px); min-width: 220px; max-width: calc(100% - 32px); padding: 13px 16px; border-radius: 10px; background: var(--primary-dark); color: white; text-align: center; font-weight: bold; box-shadow: 0 8px 24px rgba(38,50,45,0.22); opacity: 0; pointer-events: none; transition: opacity .2s ease, transform .2s ease; z-index: 999; }
        .save-toast.show { opacity: 1; transform: translate(-50%, 0); }
        @media (max-width: 640px) {
            body { padding: 8px; font-size: 15px; }
            .container { max-width: 100%; }
            .card { border-radius: 10px; padding: 12px; margin-bottom: 10px; }
            .tabs { grid-template-columns: repeat(3, 1fr); gap: 6px; position: sticky; top: 0; z-index: 10; background: var(--bg); padding-bottom: 8px; }
            .tab-btn { min-height: 44px; padding: 9px 2px; font-size: 12px; }
            .grid, .stat-grid, #vDailyArea { grid-template-columns: repeat(2, minmax(0, 1fr)) !important; gap: 8px !important; }
            .cash-coin-grid { grid-template-columns: repeat(3, minmax(0, 1fr)) !important; }
            .vendor-item-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
            .form-group input, .form-group select, .form-group textarea, .v-row input { min-height: 48px; font-size: 18px; border-radius: 10px; }
            .btn { min-height: 46px; font-size: 15px; border-radius: 10px; }
            table { font-size: 10px; table-layout: fixed; }
            table th, table td { padding: 6px 3px; word-break: break-word; }
        }
        @media (max-width: 380px) {
            .tabs { grid-template-columns: repeat(2, 1fr); }
            .grid, .stat-grid, #vDailyArea { grid-template-columns: 1fr !important; }
            .vendor-item-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
        }
        @media print {
            body.printing-report * { visibility: hidden; }
            body.printing-report #report, body.printing-report #report * { visibility: visible; }
            body.printing-report #report { display: block !important; position: absolute; left: 0; top: 0; width: 100%; }
            body.printing-report .no-print { display: none !important; }
        }
    </style>
</head>
<body>
<div class="container">
    <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('daily')">每日記帳</button>
        <button class="tab-btn" onclick="switchTab('recon')">對帳中心</button>
        <button class="tab-btn" onclick="switchTab('report')">報表中心</button>
        <button class="tab-btn" onclick="switchTab('monthly')">月結算</button>
        <button class="tab-btn" onclick="switchTab('settings')">設定/資料</button>
        <button class="tab-btn refresh-btn" onclick="location.reload()">🔄 重新整理</button>
    </div>

    <div id="daily" class="tab-content active">
        <div class="date-picker-wrap"><input type="date" id="logDate" onchange="changeDailyDate()"></div>
        <div class="card">
            <h4 style="margin:0 0 10px;">💰 今日收銀</h4>
            <div class="mode-row">
                <button type="button" class="mode-btn active" id="cashModeScaleBtn" onclick="setCashMode('scale')">秤重計算</button>
                <button type="button" class="mode-btn" id="cashModeDirectBtn" onclick="setCashMode('direct')">直接輸入</button>
            </div>
            <div id="cashScaleArea">
            <div class="grid">
                <div class="form-group"><label>千元</label><input type="number" inputmode="decimal" id="c1000" oninput="calcDaily()"></div>
                <div class="form-group"><label>百元</label><input type="number" inputmode="decimal" id="c100" oninput="calcDaily()"></div>
            </div>
            <div class="grid cash-coin-grid" style="grid-template-columns: 1fr 1fr 1fr;">
                <div class="form-group"><label>$50重</label><input type="number" inputmode="decimal" id="w50" oninput="calcDaily()"></div>
                <div class="form-group"><label>$10重</label><input type="number" inputmode="decimal" id="w10" oninput="calcDaily()"></div>
                <div class="form-group"><label>$5重</label><input type="number" inputmode="decimal" id="w5" oninput="calcDaily()"></div>
            </div>
            </div>
            <div id="cashDirectArea" style="display:none;">
                <div class="form-group"><label>收銀餘額（含零用金）</label><input type="number" inputmode="decimal" id="cashDirect" oninput="calcDaily()"></div>
            </div>
            <div class="grid">
                <div class="form-group" id="onlinePayGroup"><label>網路收入</label><input type="number" inputmode="decimal" id="pOnline" oninput="calcDaily()"></div>
                <div class="form-group" id="scanPayGroup"><label>掃碼支付</label><input type="number" inputmode="decimal" id="pScan" oninput="calcDaily()"></div>
            </div>
            <div id="paymentFeeNote" class="report-note" style="display:none"></div><button type="button" id="applyPaymentFeesBtn" class="btn btn-primary" style="display:none" onclick="applyPaymentFeesToDay()">套用目前手續費率到本日</button><div id="extraPaymentArea" class="grid"></div><div id="inactivePaymentNote" class="report-note" style="display:none"></div><div class="form-group"><label>今日零用金</label><input type="number" inputmode="decimal" id="dailyPetty" oninput="calcDaily()" placeholder="預設沿用上次設定"></div>
            <div style="text-align:right; font-size:15px; font-weight:bold; color:#764ba2;">今日營業額: <span id="cSumDisplay">$0</span></div>
        </div>
        <h4 class="section-title">📦 廠商進貨</h4>
        <div id="vendorCashNote" class="report-note" style="display:none"></div><div id="vDailyArea" style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px;"></div>
        <div class="card">
            <h4 style="margin:0 0 10px;">雜支</h4>
            <div class="grid">
                <div class="form-group"><label>品名</label><input type="text" id="miscName" placeholder="例如：臨時用品"></div>
                <div class="form-group"><label>金額</label><input type="number" inputmode="numeric" pattern="[0-9]*" id="miscAmount" placeholder="金額"></div>
                <label class="check-row"><input type="checkbox" id="miscUnpaid" onchange="toggleMiscPayer()">未支付 / 代墊</label>
                <div class="form-group" id="miscPayerWrap" style="display:none;"><label>代墊人</label><select id="miscPayer"></select></div>
            </div>
            <button class="btn btn-primary" id="miscSubmitBtn" onclick="addMiscExpense()">+ 新增雜支</button>
            <button class="btn btn-warning" id="miscCancelEditBtn" style="display:none;" onclick="cancelMiscEdit()">取消編輯</button>
            <div id="miscList" class="misc-list"></div>
        </div>
        <button class="btn btn-success" style="margin-top:15px;" onclick="saveDaily()">✅ 儲存今日數據</button>
    </div>

    <div id="recon" class="tab-content">
        <div class="date-picker-wrap"><input type="month" id="reconMonth" onchange="renderRecon()"></div>
        <div class="recon-layout">
            <div class="card" id="reconVendorList" style="font-size:13px;padding:10px;"></div>
            <div id="reconDetailArea" style="flex: 1;"></div>
        </div>
        <div id="reconSummaryArea" class="card" style="display:none; background: #fffbe6;"></div>
        <div id="reconAction" class="card" style="display:none;">
            <h4 style="margin:0 0 10px">新增明細</h4><div class="grid">
            <div class="form-group"><label>日期</label><input type="date" id="addReconDate"></div>
            <div class="form-group"><label>廠商</label><select id="addReconVendor"></select></div>
            <div class="form-group"><label>金額</label><input type="number" min="0" inputmode="decimal" id="addAmt"></div></div>
            <button class="btn btn-primary" onclick="addReconEntry()">＋ 新增</button>
        </div>
    </div>

    <div id="report" class="tab-content">
        <div class="date-picker-wrap"><input type="month" id="rMonth" onchange="genFullReport()"></div>
        <div id="repArea"></div>
        <button class="btn btn-info no-print" style="margin-top:15px;" onclick="exportReportPdf()">輸出 PDF</button>
        <div id="souffleArea"></div>
    </div>

    <div id="monthly" class="tab-content">
        <div class="date-picker-wrap"><input type="month" id="mMonth" onchange="loadMonthly()"></div>
        <div id="mStartSummary" class="card report-note"></div>
        <div class="card">
            <h4 class="section-title">水電瓦斯費用</h4><button type="button" class="btn btn-info" onclick="applyCurrentBillingSettings()">套用設定頁的記帳方式至本月</button>
            <div class="grid">
                <div class="form-group"><label>總表110</label><input type="number" inputmode="decimal" id="me110" oninput="showLiveCalc('e110')"><div id="hint_e110" class="calc-hint"></div></div>
                <div class="form-group"><label>總表220</label><input type="number" inputmode="decimal" id="me220" oninput="showLiveCalc('e220')"><div id="hint_e220" class="calc-hint"></div></div>
                <div class="form-group"><label>水費抄表</label><input type="number" inputmode="decimal" id="mw" oninput="showLiveCalc('w')"><div id="hint_w" class="calc-hint"></div></div>
                <div class="form-group"><label>瓦斯抄表</label><input type="number" inputmode="decimal" id="mg" oninput="showLiveCalc('g')"><div id="hint_g" class="calc-hint"></div></div>
                <div class="form-group"><label>電費金額</label><input type="number" inputmode="decimal" min="0" id="melectricAmount"></div><div class="form-group"><label>水費金額</label><input type="number" inputmode="decimal" min="0" id="mwaterAmount"></div><div class="form-group"><label>瓦斯費金額</label><input type="number" inputmode="decimal" min="0" id="mgasAmount"></div><div class="form-group"><label>房租</label><input type="number" inputmode="decimal" id="mrent"></div>
                <div class="form-group"><label>公攤額</label><input type="number" inputmode="decimal" id="mpub"></div>
                <div class="form-group"><label>稅金基數</label><input type="number" inputmode="decimal" id="mtaxb"></div>
            </div>
            <h4 class="section-title">自訂固定支出</h4>
            <div id="mFixedArea" class="grid"></div>
            <h4 class="section-title">未支付雜支結算</h4>
            <div id="mUnpaidMiscArea"></div>
            <h4 class="section-title">👥 薪資獎金</h4>
            <div id="mStaffArea"></div>
            <div id="subleaseMonthlySection">
            <h4 class="section-title">分租報表</h4>
            <div class="grid">
                <div class="form-group"><label>分租電表110</label><input type="number" inputmode="decimal" id="mse110" oninput="showLiveCalc('se110')"><div id="hint_se110" class="calc-hint"></div></div>
                <div class="form-group"><label>分租電表220</label><input type="number" inputmode="decimal" id="mse220" oninput="showLiveCalc('se220')"><div id="hint_se220" class="calc-hint"></div></div>
                <div class="form-group"><label>分租租金</label><input type="number" inputmode="decimal" id="msouffleRent" value="15000"></div>
                <div class="form-group"><label>營業額稅金基數</label><input type="number" inputmode="decimal" id="msouffleRevenue"></div>
            </div>
            </div>
            <button class="btn btn-success" style="margin-top:15px;" onclick="saveMonthlyOnly()">💾 儲存本月報表數據</button>
        </div>
    </div>

    <div id="settings" class="tab-content">
        <div class="card">
<h4 class="section-title">基本設定</h4><div class="form-group"><label>零用金</label><input type="number" id="sPetty"></div><h4 class="section-title">費用功能</h4>
<div class="feature-box"><label class="check-row"><input type="checkbox" id="sHasElectric" onchange="toggleSettingsFeatures()">有電費</label><div id="sElectricOptions"><div class="form-group"><label>記帳方式</label><select id="sElectricMode" onchange="toggleSettingsFeatures()"><option value="meter">抄表計算</option><option value="amount">直接輸入金額</option></select></div><div id="sElectricMeterOptions" class="grid"><div class="form-group"><label>電費單價</label><input type="number" id="upElec"></div><div class="form-group"><label>上次結算總110度數</label><input type="number" id="si110"></div><div class="form-group"><label>上次結算總220度數</label><input type="number" id="si220"></div></div></div></div>
<div class="feature-box"><label class="check-row"><input type="checkbox" id="sHasWater" onchange="toggleSettingsFeatures()">有水費</label><div id="sWaterOptions"><div class="form-group"><label>記帳方式</label><select id="sWaterMode" onchange="toggleSettingsFeatures()"><option value="meter">抄表計算</option><option value="amount">直接輸入金額</option></select></div><div id="sWaterMeterOptions" class="grid"><div class="form-group"><label>水費單價</label><input type="number" id="upWater"></div><div class="form-group"><label>上次結算水錶度數</label><input type="number" id="siw"></div></div></div></div>
<div class="feature-box"><label class="check-row"><input type="checkbox" id="sHasGas" onchange="toggleSettingsFeatures()">有瓦斯費</label><div id="sGasOptions"><div class="form-group"><label>記帳方式</label><select id="sGasMode" onchange="toggleSettingsFeatures()"><option value="meter">抄表計算</option><option value="amount">直接輸入金額</option></select></div><div id="sGasMeterOptions" class="grid"><div class="form-group"><label>瓦斯費單價</label><input type="number" id="upGas"></div><div class="form-group"><label>上次結算瓦斯錶度數</label><input type="number" id="sig"></div></div></div></div>
<div class="form-group" id="sStartMonthWrap"><label>上次抄表結算月份</label><input type="month" id="sStartMonth"></div>
<div class="feature-box"><label class="check-row"><input type="checkbox" id="sHasPublic" onchange="toggleSettingsFeatures()">有公攤費</label><div id="sPublicOptions" class="form-group"><label>公攤費比例</label><input type="number" inputmode="decimal" id="sPublicRate"></div></div>
<div class="feature-box"><label class="check-row"><input type="checkbox" id="sHasTax" onchange="toggleSettingsFeatures()">有稅金</label><div id="sTaxOptions" class="form-group"><label>稅金比例</label><input type="number" inputmode="decimal" id="sTaxRate"></div></div>
<h4 class="section-title">收入項目</h4>
<div class="feature-box"><label class="check-row"><input type="checkbox" id="sShowOnlinePay" onchange="toggleSettingsFeatures()">啟用網路收入</label><div id="sOnlineNameOptions" class="form-group"><label>收入名稱</label><input id="sOnlineName" placeholder="自行輸入名稱"><label>手續費率（%）</label><input type="number" min="0" max="100" step="0.01" inputmode="decimal" id="sOnlineFee" oninput="savePaymentFeeSetting('pOnline',this.value)"></div></div>
<div class="feature-box"><label class="check-row"><input type="checkbox" id="sShowScanPay" onchange="toggleSettingsFeatures()">啟用掃碼支付</label><div id="sScanNameOptions" class="form-group"><label>收入名稱</label><input id="sScanName" placeholder="自行輸入名稱"><label>手續費率（%）</label><input type="number" min="0" max="100" step="0.01" inputmode="decimal" id="sScanFee" oninput="savePaymentFeeSetting('pScan',this.value)"></div></div>
<div class="report-note">輸入交易金額，手續費另列支出。費率輸入後自動儲存，套用目前記帳日及新紀錄。舊日期可在每日記帳按「套用目前手續費率到本日」。</div><div id="paymentSettings"></div><button type="button" class="btn btn-primary" onclick="addPaymentSetting()">＋ 新增收入項目</button>
            <button class="btn btn-success" onclick="saveSettings()">💾 儲存基本設定</button>
        </div>
        <div class="card">
            <h4 class="section-title">分租設定</h4>
            <label class="check-row"><input type="checkbox" id="sHasSublease" onchange="toggleSubleaseSettings()">有分租</label>
            <div id="subleaseSettingsFields" class="grid">
                <div class="form-group"><label>分租名稱</label><input type="text" id="sSubleaseName" placeholder="例如：舒芙蕾"></div>
                <div class="form-group"><label>分租租金</label><input type="number" inputmode="decimal" id="sSubleaseRent"></div>

            <button class="btn btn-info" onclick="document.getElementById('importFile').click()">📤 匯入數據</button>
            <input type="file" id="importFile" style="display:none" onchange="importData(event)" accept=".json">
            <button class="btn btn-danger" onclick="clearAllData()" style="grid-column: span 2;">⚠️ 清空所有資料</button>
        </div>
    </div>
</div>
<div id="saveToast" class="save-toast">已儲存</div>

<script>
const KEY = "wazi_v23_";
const get = (k)=>JSON.parse(localStorage.getItem(KEY+k)) || [];
const set = (k,v)=>localStorage.setItem(KEY+k, JSON.stringify(v));
const defaultCfg = {petty:8000, i110:0, i220:0, is110:0, is220:0, iw:0, ig:0, ue:5, uw:12, ug:20, startMonth:'', publicRate:0.75, taxRate:0.05, hasSublease:false, subleaseName:'分租', subleaseRent:15000, showOnlinePay:true, showScanPay:true};
const cfg = ()=>Object.assign({}, defaultCfg, JSON.parse(localStorage.getItem(KEY+'cfg')) || {});
let dailyMisc = [];
let editingMiscIndex = null;
let isLoadingDaily = false;
let loadedDailyDate = "";
let isLoadingMonthly = false;
const num = (v)=>parseFloat(v) || 0;
const money = (v)=>`$${Math.round(num(v)).toLocaleString()}`;
const unitMoney = (v)=>`$${num(v).toLocaleString(undefined, {maximumFractionDigits: 4})}`;

function currentMonthValue(){
    const now = new Date();
    const tzOffset = now.getTimezoneOffset() * 60000;
    return (new Date(Date.now() - tzOffset)).toISOString().slice(0, 7);
}

function nextMonthValue(month){
    if(!month) return '';
    const [year, monthNum] = month.split('-').map(Number);
    if(!year || !monthNum) return '';
    const next = new Date(year, monthNum, 1);
    return `${next.getFullYear()}-${String(next.getMonth() + 1).padStart(2, '0')}`;
}

function startFromCfg(c){
    return {i110:num(c.i110), i220:num(c.i220), is110:num(c.is110), is220:num(c.is220), iw:num(c.iw), ig:num(c.ig)};
}

function saveStartForMonth(month, start){
    if(month) set('start_'+month, start);
}

function saveLastSettledAsNextStart(c){
    const nextMonth = nextMonthValue(c.startMonth);
    saveStartForMonth(nextMonth || c.startMonth, startFromCfg(c));
    return nextMonth || c.startMonth;
}

function applyStartToMonthlyData(month, start){
    if(!month) return;
    const data = JSON.parse(localStorage.getItem(KEY+'m_'+month)) || {staff:{}, bonus:{}};
    data.start = start;
    set('m_'+month, data);
}

function getSavedStartForMonth(month){
    const start = JSON.parse(localStorage.getItem(KEY+'start_'+month));
    return start && typeof start === 'object' ? start : null;
}

function getStartForMonth(month, c, monthlyData = null){
    if(monthlyData?.start) return monthlyData.start;
    const savedStart = getSavedStartForMonth(month);
    if(savedStart) return savedStart;
    return startFromCfg(c);
}

function initApp(){
    const now = new Date();
    const tzOffset = now.getTimezoneOffset() * 60000;
    const localISO = (new Date(Date.now() - tzOffset)).toISOString();
    document.getElementById('logDate').value = localISO.slice(0, 10);
    document.getElementById('reconMonth').value = localISO.slice(0, 7);
    document.getElementById('rMonth').value = localISO.slice(0, 7);
    document.getElementById('mMonth').value = localISO.slice(0, 7);
    setupNumericKeyboards();
    loadDaily(); renderRecon(); loadMonthly();
}

function setupNumericKeyboards(){
    document.querySelectorAll('input[type="number"]').forEach(input => {
        input.setAttribute('inputmode', 'decimal');
        input.setAttribute('pattern', '[0-9.]*');
        input.setAttribute('enterkeyhint', 'done');
        input.setAttribute('autocomplete', 'off');
        input.setAttribute('step', 'any');
    });
}

function getMonthlyData(month){
    const data = JSON.parse(localStorage.getItem(KEY+'m_'+month)) || {staff:{}, bonus:{}, e110:0, e220:0, se110:0, se220:0, w:0, g:0, pub:0, rent:0, taxb:0, lease:0};
    if(!data.start) data.start = getStartForMonth(month, cfg(), data);
    return data;
}

function getMonthlyCalcBase(m, c, month = ''){
    return {
        start: getStartForMonth(month, c, m),
        rates: m.pdfLocked && m.rates ? m.rates : {ue:c.ue, uw:c.uw, ug:c.ug}
    };
}

function renderMonthlyStartSummary(month, m, c){
    const box = document.getElementById('mStartSummary');
    if(!box) return;
    const base = getMonthlyCalcBase(m, c, month);
    const start = base.start || {};
    const subleaseMeters = c.hasSublease ? `　分租110: ${num(start.is110)}　分租220: ${num(start.is220)}` : '';
    box.innerHTML = `<b>${month || '本月'} 計算基準</b><br>總110: ${num(start.i110)}　總220: ${num(start.i220)}　水: ${num(start.iw)}　瓦斯: ${num(start.ig)}${subleaseMeters}`;
}

function getFixedExpenses(){
    return get('fixedExpenses').map((item, index) => ({
        id: item.id || `legacy_${index}`,
        name: item.name || `固定支出${index + 1}`,
        amount: num(item.amount),
        enabled: item.enabled !== false
    }));
}

function getEnabledFixedExpenses(){
    return getFixedExpenses().filter(item => item.enabled !== false);
}

function getMiscPayers(){
    const names = get('staff').map(s => s.n).concat('其他');
    return [...new Set(names.filter(Boolean))];
}

function isMiscSettled(item){
    return !item.unpaid || item.settled;
}

function getUnpaidMiscEntries(month){
    const entries = [];
    for(let i=1; i<=31; i++){
        const date = month + '-' + String(i).padStart(2,'0');
        const d = JSON.parse(localStorage.getItem(KEY+'d_'+date));
        (d?.misc || []).forEach((item, index) => {
            if(item.unpaid && !item.settled) entries.push({date, index, item});
        });
    }
    return entries;
}

function lockMonthlyRatesForPdf(month){
    const c = cfg();
    const m = getMonthlyData(month);
    if(!confirm(`輸出 PDF 前請確認本月單價無誤：\n\n電單價：${unitMoney(c.ue)}\n水單價：${unitMoney(c.uw)}\n瓦斯單價：${unitMoney(c.ug)}\n\n確認後會鎖定 ${month} 的水電瓦斯單價，之後設定頁改單價也不會影響這個月份。\n\n確定要輸出 PDF 嗎？`)) return false;
    m.rates = {ue:num(c.ue), uw:num(c.uw), ug:num(c.ug)};
    m.pdfLocked = true;
    set('m_'+month, m);
    return true;
}

function getFixedExpenseRows(m, c){
    const {start, rates} = getMonthlyCalcBase(m, c);
    const publicRate = num(m.publicRate ?? c.publicRate);
    const taxRate = num(m.taxRate ?? c.taxRate);
    const e110Use = Math.max(0, num(m.e110) - num(start.i110));
    const e220Use = Math.max(0, num(m.e220) - num(start.i220));
    const se110Use = c.hasSublease ? Math.max(0, num(m.se110) - num(start.is110)) : 0;
    const se220Use = c.hasSublease ? Math.max(0, num(m.se220) - num(start.is220)) : 0;
    const eNet = Math.max(0, e110Use + e220Use - se110Use - se220Use);
    const waterUse = Math.max(0, num(m.w) - num(start.iw));
    const gasUse = Math.max(0, num(m.g) - num(start.ig));
    const baseRows = [
        {label:'房租', detail:'月租金', amount:num(m.rent)},
        {label:'公攤', detail:`本月金額 ${money(m.pub)} × 設定乘數 ${publicRate}`, amount:num(m.pub) * publicRate},
        {label:'電費', detail:`總110 ${num(start.i110)}→${num(m.e110)}，總220 ${num(start.i220)}→${num(m.e220)}，分表扣 ${se110Use.toFixed(1)}+${se220Use.toFixed(1)}，實用 ${eNet.toFixed(1)} 度 × ${unitMoney(rates.ue)}`, amount:eNet * num(rates.ue)},
        {label:'水費', detail:`${num(start.iw)}→${num(m.w)}，用量 ${waterUse.toFixed(1)} 度 × ${unitMoney(rates.uw)}`, amount:waterUse * num(rates.uw)},
        {label:'瓦斯', detail:`${num(start.ig)}→${num(m.g)}，用量 ${gasUse.toFixed(1)} 度 × ${unitMoney(rates.ug)}`, amount:gasUse * num(rates.ug)},
        {label:'稅金', detail:`本月基數 ${money(m.taxb)} × 設定比例 ${taxRate}`, amount:num(m.taxb) * taxRate}
    ];
    const customRows = getEnabledFixedExpenses().map(item => ({
        label:item.name,
        detail:`設定金額 ${money(item.amount)}，本月採用 ${money(m.fixed?.[item.id] ?? item.amount)}`,
        amount:num(m.fixed?.[item.id] ?? item.amount)
    }));
    const modes=monthlyModes(m);
    for(const [key,label] of [['electric','電費'],['water','水費'],['gas','瓦斯']]){
        if(modes[key]==='amount'){ const row=baseRows.find(r=>r.label===label); row.detail='直接輸入金額'; row.amount=num(m.utilityAmounts?.[key]); }
    }
    return baseRows.filter(r=>(r.label!=='公攤'||m.hasPublic!==false)&&(r.label!=='稅金'||m.hasTax!==false)&&!Object.entries({electric:'電費',water:'水費',gas:'瓦斯'}).some(([key,label])=>r.label===label&&m.utilityEnabled?.[key]===false)).concat(customRows);
}

function getSouffleExpenseRows(m, c){
    if(!c.hasSublease) return [];
    const {start, rates} = getMonthlyCalcBase(m, c);
    const publicRate = num(m.publicRate ?? c.publicRate);
    const taxRate = num(m.taxRate ?? c.taxRate);
    const se110Use = Math.max(0, num(m.se110) - num(start.is110));
    const se220Use = Math.max(0, num(m.se220) - num(start.is220));
    const subElectricUse = se110Use + se220Use;
    const waterUse = Math.max(0, num(m.w) - num(start.iw));
    const waterAmount = monthlyModes(m).water==='amount' ? num(m.utilityAmounts?.water) : waterUse * num(rates.uw);
    const pubAmount = m.hasPublic===false ? 0 : num(m.pub) * publicRate;
    const legacySouffle = m.souffle || {};
    const souffle = {
        rent: legacySouffle.rent ?? c.subleaseRent ?? c.souffleRent ?? 15000,
        revenue: legacySouffle.revenue ?? c.souffleRevenue ?? 0
    };
    return [
        {label:'租金', detail:'本月舒芙蕾租金', amount:num(souffle.rent)},
        {label:'電費', detail:`舒芙蕾分表 ${se110Use.toFixed(1)} + ${se220Use.toFixed(1)} = ${subElectricUse.toFixed(1)} 度 × 店裡電單價 ${unitMoney(rates.ue)}`, amount:subElectricUse * num(rates.ue)},
        {label:'水費', detail:monthlyModes(m).water==='amount'?'同主報表水費：直接輸入金額':`同主報表水費：${waterUse.toFixed(1)} 度 × ${unitMoney(rates.uw)}`, amount:waterAmount},
        {label:'公攤費', detail:`同主報表公攤：${money(m.pub)} × ${publicRate}`, amount:pubAmount},
        {label:'營業額稅金', detail:`${money(souffle.revenue)} × ${taxRate}`, amount:num(souffle.revenue) * taxRate}
    ].filter(r=>(r.label!=='公攤費'||m.hasPublic!==false)&&(r.label!=='水費'||m.utilityEnabled?.water!==false)&&(r.label!=='電費'||m.utilityEnabled?.electric!==false)&&(r.label!=='營業額稅金'||m.hasTax!==false));
}

function switchTab(id){
    if(document.getElementById('daily').classList.contains('active')&&id!=='daily'){clearTimeout(scheduleDailyAutosave.timer);saveDaily(true);}
    if(id==='recon')renderRecon();
    document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
    document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
    document.getElementById(id).classList.add('active');
    const btn = document.querySelector(`.tab-btn[onclick*="${id}"]`);
    if(btn) btn.classList.add('active');
    if(id==='report') genFullReport();
    if(id==='monthly') loadMonthly();
    if(id==='settings') renderSettings();
}


function paymentItems(c = cfg()) { return Array.isArray(c.paymentItems) ? c.paymentItems : []; }
function addPaymentSetting(){
 const box=document.getElementById('paymentSettings');
 const row=document.createElement('div'); row.className='feature-box';
 const checkLabel=document.createElement('label'); checkLabel.className='check-row'; const check=document.createElement('input'); check.type='checkbox'; check.checked=true; check.className='payment-enabled'; checkLabel.append(check,document.createTextNode('啟用收入項目')); row.append(checkLabel);
 const input=document.createElement('input'); input.className='payment-name'; input.dataset.id='pay_'+Date.now()+'_'+Math.random().toString(36).slice(2,7); input.placeholder='例如：街口支付、foodpanda';
 const label=document.createElement('label'); label.textContent='收入項目名稱'; const options=document.createElement('div'); options.className='payment-options'; options.append(label,input); const feeLabel=document.createElement('label');feeLabel.textContent='手續費率（%）';const fee=document.createElement('input');fee.type='number';fee.min=0;fee.max=100;fee.step='0.01';fee.value=0;fee.className='payment-fee';fee.dataset.id=input.dataset.id;fee.oninput=()=>{if(paymentItems().some(p=>p.id===fee.dataset.id))savePaymentFeeSetting(fee.dataset.id,fee.value);};options.append(feeLabel,fee); row.append(options); check.dataset.id=input.dataset.id; check.onchange=()=>togglePaymentOption(check); box.append(row); input.focus();
}
function renderPaymentSettings(c){
 document.getElementById('paymentSettings').innerHTML=paymentItems(c).map(p=>`<div class="feature-box"><label class="check-row"><input type="checkbox" class="payment-enabled" data-id="${escapeHtml(p.id)}" ${p.enabled!==false?'checked':''} onchange="togglePaymentOption(this)">啟用 ${escapeHtml(p.name)}</label><div class="form-group payment-options" style="display:${p.enabled!==false?'block':'none'}"><label>收入名稱</label><input class="payment-name" data-id="${escapeHtml(p.id)}" value="${escapeHtml(p.name)}"><label>手續費率（%）</label><input type="number" min="0" max="100" step="0.01" class="payment-fee" data-id="${escapeHtml(p.id)}" value="${feeRate(p.feeRate)}" oninput="savePaymentFeeSetting(this.dataset.id,this.value)"></div></div>`).join('');
}
function togglePaymentOption(input){ input.closest('.feature-box').querySelector('.payment-options').style.display=input.checked?'block':'none'; }
function toggleSettingsFeatures(){
 let hasMeter=false;
 for(const key of ['Electric','Water','Gas']){
  const enabled=document.getElementById('sHas'+key).checked;
  const meter=document.getElementById('s'+key+'Mode').value==='meter';
  document.getElementById('s'+key+'Options').style.display=enabled?'block':'none';
  document.getElementById('s'+key+'MeterOptions').style.display=enabled&&meter?'grid':'none';
  hasMeter=hasMeter||enabled&&meter;
 }
 document.getElementById('sStartMonthWrap').style.display=hasMeter?'block':'none';
 for(const [toggle,wrap] of [['sHasPublic','sPublicOptions'],['sHasTax','sTaxOptions'],['sShowOnlinePay','sOnlineNameOptions'],['sShowScanPay','sScanNameOptions']]) document.getElementById(wrap).style.display=document.getElementById(toggle).checked?'block':'none';
 toggleSubleaseSettings();
}
function renderExtraPayments(d){
 const items=paymentItems(); const saved=d.payments||{};
 document.getElementById('extraPaymentArea').innerHTML=items.filter(p=>p.enabled!==false).map(p=>`<div class="form-group"><label>${escapeHtml(p.name)}${p.enabled===false?'（已停用）':''}</label><input type="number" inputmode="decimal" class="extra-payment" data-id="${escapeHtml(p.id)}" value="${escapeHtml(saved[p.id] ?? '')}" oninput="calcDaily()"></div>`).join('');
}
function collectExtraPayments(){
 const date=document.getElementById('logDate').value;
 const old=JSON.parse(localStorage.getItem(KEY+'d_'+date))||{};
 const result={...(old.payments||{})};
 document.querySelectorAll('.extra-payment').forEach(i=>result[i.dataset.id]=i.value); return result;
}
function extraPaymentTotal(d){ return Object.values(d.payments||{}).reduce((sum,v)=>sum+num(v),0); }
function feeRate(value){ return Math.min(100,Math.max(0,num(value))); }
function configuredPaymentFees(c=cfg()){
 return {pOnline:feeRate(c.onlineFeeRate),pScan:feeRate(c.scanFeeRate),...Object.fromEntries(paymentItems(c).map(p=>[p.id,feeRate(p.feeRate)]))};
}
function dailyPaymentFeeRates(d){
 const hasHistory=[d.pOnline,d.pScan,...Object.values(d.payments||{})].some(v=>v!==''&&v!=null);
 if(!hasHistory)return configuredPaymentFees();
 return d.paymentFeeRates?{...d.paymentFeeRates}:{};
}
function paymentSettlement(d){
 const rates=d.paymentFeeRates||{},amounts={pOnline:num(d.pOnline),pScan:num(d.pScan),...(d.payments||{})};
 let gross=0,fees=0;
 for(const [id,value] of Object.entries(amounts)){const amount=num(value);gross+=amount;fees+=Math.round(amount*feeRate(rates[id]))/100;}
 return {gross,fees:Math.round(fees*100)/100,net:Math.round((gross-fees)*100)/100};
}
function showPaymentSettlement(d){
 const result=paymentSettlement(d),note=document.getElementById('paymentFeeNote');
 const current=configuredPaymentFees(),saved=d.paymentFeeRates||{},amounts={pOnline:d.pOnline,pScan:d.pScan,...(d.payments||{})};const differs=Object.entries(amounts).some(([id,value])=>num(value)&&feeRate(current[id])!==feeRate(saved[id]));document.getElementById('applyPaymentFeesBtn').style.display=differs?'block':'none';
 note.style.display=result.gross?'block':'none';note.textContent=`支付交易 $${result.gross.toLocaleString()} · 手續費 $${result.fees.toLocaleString()} · 預計入帳 $${result.net.toLocaleString()}`;
}
function applyPaymentFeesToDay(){
 saveDaily(true);const date=document.getElementById('logDate').value,d=JSON.parse(localStorage.getItem(KEY+'d_'+date))||{};
 set('d_'+date,{...d,paymentFeeRates:configuredPaymentFees()});calcDaily(true);if(document.getElementById('rMonth').value)genFullReport();showSaveToast('本日手續費率已更新');
}
function savePaymentFeeSetting(id,value){
 const c=cfg(),rate=feeRate(value);
 if(id==='pOnline')c.onlineFeeRate=rate;else if(id==='pScan')c.scanFeeRate=rate;else c.paymentItems=paymentItems(c).map(p=>p.id===id?{...p,feeRate:rate}:p);
 set('cfg',c);applyPaymentFeesToDay();
}
function applyCurrentBillingSettings(){
 const month=document.getElementById('mMonth').value, c=cfg();
 const m=collectMonthlyData();
 m.utilityModes={electric:c.electricMode||'meter',water:c.waterMode||'meter',gas:c.gasMode||'meter'};
 m.hasPublic=c.hasPublic!==false; m.utilityEnabled={electric:c.hasElectric!==false,water:c.hasWater!==false,gas:c.hasGas!==false}; m.hasTax=c.hasTax!==false;
 set('m_'+month,m); loadMonthly(); refreshReportIfSameMonth(month); showSaveToast('本月記帳方式已更新');
}
function monthlyModes(m){ return m.utilityModes || {electric:'meter',water:'meter',gas:'meter'}; }
function applyMonthlyModes(m,c){
 const modes=m.utilityModes || (['e110','e220','w','g'].some(k=>Object.prototype.hasOwnProperty.call(m,k)) ? monthlyModes(m) : {electric:c.electricMode||'meter',water:c.waterMode||'meter',gas:c.gasMode||'meter'});
 document.getElementById('monthly').dataset.utilityModes=JSON.stringify(modes);
 const existing=['e110','e220','w','g'].some(k=>Object.prototype.hasOwnProperty.call(m,k));
 const enabled=m.utilityEnabled || (existing?{electric:true,water:true,gas:true}:{electric:c.hasElectric!==false,water:c.hasWater!==false,gas:c.hasGas!==false});
 document.getElementById('monthly').dataset.utilityEnabled=JSON.stringify(enabled);
 const hasTax=m.hasTax ?? (existing?true:c.hasTax!==false); document.getElementById('monthly').dataset.hasTax=String(hasTax); document.getElementById('mtaxb').parentElement.style.display=hasTax?'block':'none';
 for(const [key,fields] of Object.entries({electric:['me110','me220'],water:['mw'],gas:['mg']})){
  fields.forEach(id=>document.getElementById(id).parentElement.style.display=enabled[key]!==false&&modes[key]!=='amount'?'block':'none');
  const input=document.getElementById('m'+key+'Amount'); input.parentElement.style.display=enabled[key]!==false&&modes[key]==='amount'?'block':'none'; input.value=m.utilityAmounts?.[key] ?? '';
 }
 const publicEnabled=m.hasPublic ?? (Object.prototype.hasOwnProperty.call(m,'pub') ? true : c.hasPublic!==false);
 document.getElementById('monthly').dataset.hasPublic=String(publicEnabled);

 for(let day=1;day<=31;day++){

 }
 return items.filter(p=>p.enabled!==false || Array.from({length:31},(_,i)=>JSON.parse(localStorage.getItem(KEY+'d_'+month+'-'+String(i+1).padStart(2,'0')))||{}).some(d=>num(d.payments?.[p.id])));

function calcDaily(skipAutosave = false){
    if(isLoadingDaily)return;
    const c = cfg(); 
    const val = (id)=>parseFloat(document.getElementById(id).value) || 0;
    const cashMode = document.getElementById('cashDirectArea')?.style.display === 'block' ? 'direct' : 'scale';
    const paymentIds = ['c1000','c100','w50','w10','w5','cashDirect','pOnline','pScan'];
    const hasInput = paymentIds.some(id=>document.getElementById(id)?.value !== '') || Object.values(collectExtraPayments()).some(v=>v!==''&&v!=null);
    const oldNote=document.getElementById('inactivePaymentNote'); if(oldNote){oldNote.style.display='none';oldNote.textContent='';}
    if(!hasInput) { document.getElementById('paymentFeeNote').style.display='none';document.getElementById('applyPaymentFeesBtn').style.display='none'; const cashNote=document.getElementById('vendorCashNote');if(cashNote)cashNote.style.display='none';document.getElementById('cSumDisplay').innerText = `$ 0`; if(!skipAutosave)scheduleDailyAutosave(); return; }
    const cashRaw = (val('c1000')*1000) + (val('c100')*100) + (Math.max(0, val('w50')-26)*5) + (Math.max(0, val('w10')-26)*1.33) + (Math.max(0, val('w5')-26)*1.1);
    const petty = val('dailyPetty');
    const cash = getNetCashRevenue(cashMode === 'direct' ? val('cashDirect') : cashRaw, petty);
    const online = val('pOnline');
    const scan = val('pScan');
    const cashPaid=vendorCashPaid(vendorDraft());
    const cashNote=document.getElementById('vendorCashNote');if(cashNote){cashNote.style.display=cashPaid?'block':'none';cashNote.textContent='廠商現金付款加回 '+money(cashPaid);}
    const feeDay=vendorDraft();showPaymentSettlement({...feeDay,pOnline:online,pScan:scan,payments:collectExtraPayments(),paymentFeeRates:dailyPaymentFeeRates(feeDay)});
    const result = cash + online + scan + extraPaymentTotal({payments:collectExtraPayments()}) + cashPaid;
    const activeIds=new Set(paymentItems(c).filter(p=>p.enabled!==false).map(p=>p.id));
    const hiddenTotal=(c.showOnlinePay?0:online)+(c.showScanPay?0:scan)+Object.entries(collectExtraPayments()).reduce((sum,[id,value])=>sum+(activeIds.has(id)?0:num(value)),0);
    const note=document.getElementById('inactivePaymentNote'); if(note){note.style.display=hiddenTotal?'block':'none';note.textContent=hiddenTotal?'本日已停用收入項目的歷史金額 '+money(hiddenTotal)+' 仍計入營業額':'';}
    document.getElementById('cSumDisplay').innerText = `$ ${Math.round(result).toLocaleString()}`;
    if(!skipAutosave)scheduleDailyAutosave();
}

function getDailyRevenue(d, c, date=d.date||''){
    const val = (v)=>parseFloat(v)||0;
    const cashOnly = (val(d.c1000)*1000) + (val(d.c100)*100) + (Math.max(0, val(d.w50)-26)*5) + (Math.max(0, val(d.w10)-26)*1.33) + (Math.max(0, val(d.w5)-26)*1.1);
    const cash = getNetCashRevenue(d.cashMode === 'direct' ? val(d.cashDirect) : cashOnly, d.petty ?? c.petty) + vendorCashPaid(d,date);
    const online = val(d.pOnline);
    const scan = val(d.pScan);
    return {cash, online, scan, total: cash + online + scan + extraPaymentTotal(d)};
}

function getNetCashRevenue(cashAmount, pettyAmount){
    return (parseFloat(cashAmount) || 0) - num(pettyAmount);
}

function getEffectivePettyForDate(date, dailyData = null){
    const ownPetty = dailyData?.petty;
    if(ownPetty !== undefined && ownPetty !== null && ownPetty !== '') return num(ownPetty);
    let latestDate = '';
    let latestPetty = null;
    for(let i = 0; i < localStorage.length; i++){
        const key = localStorage.key(i);
        if(!key.startsWith(KEY+'d_')) continue;
        const day = key.slice((KEY+'d_').length);
        if(day >= date || day <= latestDate) continue;
        const data = JSON.parse(localStorage.getItem(key)) || {};
        if(data.petty !== undefined && data.petty !== null && data.petty !== ''){
            latestDate = day;
            latestPetty = num(data.petty);
        }
    }
    return latestPetty !== null ? latestPetty : num(cfg().petty);
}

function getVendorEntry(entryKey, entryValue, vendors){
    const vendor = vendors
        .filter(v => entryKey === v.name || entryKey.startsWith(v.name+'_'))
        .sort((a,b) => b.name.length - a.name.length)[0];
    if(!vendor) return null;
    if(entryKey === vendor.name) return {name:vendor.name, amount:vendorAmountValue(entryValue)};
    const price = num(entryKey.slice(entryKey.lastIndexOf('_') + 1));
    return {name:vendor.name, amount:num(entryValue) * price};
}

function vendorAmountValue(value){
    if(Array.isArray(value)) return value.reduce((sum, item) => sum + num(item), 0);
    return num(value);
}

function getVendorAmountLines(d, vendorName){
    const value = d.vs?.[vendorName];
    if(Array.isArray(value)){
        const values = value.filter(item => item !== undefined && item !== null && item !== '' && num(item) !== 0);
        return values.length ? values : [''];
    }
    if(value !== undefined && value !== null && value !== '' && num(value) !== 0) return [value];
    return [''];
}

    const activeVendors = get('vendors');
    let dayRows="", tCash=0, tOnline=0, tScan=0, tDays=0, tFees=0, tPaymentNet=0, vSum={}, miscRows="", tMisc=0;

    reportPayments.forEach(p=>paymentTotals[p.id]=0);

    for(let i=1; i<=31; i++){
        const date = month + '-' + String(i).padStart(2,'0');
        const d = JSON.parse(localStorage.getItem(KEY+'d_'+date));
        if(d){
            const hasData = [d.c1000, d.c100, d.w50, d.w10, d.w5, d.cashDirect, d.pOnline, d.pScan].some(v=>v!='' && v!=null) || Object.values(d.payments||{}).some(v=>v!=='' && v!=null);
            if(hasData){
                const rev = getDailyRevenue(d, c, date);const settlement=paymentSettlement(d);tFees+=settlement.fees;tPaymentNet+=settlement.net;

                tCash += rev.cash; tOnline += rev.online; tScan += rev.scan; tDays++;

            }
            (d.misc||[]).forEach(item => {

function loadPdfGenerator(){
    if(window.html2pdf) return Promise.resolve();
    if(loadPdfGenerator.promise) return loadPdfGenerator.promise;
    loadPdfGenerator.promise = new Promise((resolve, reject) => {
        const script = document.createElement('script');
        script.src = 'https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js';
        script.onload = resolve;
        script.onerror = () => reject(new Error('PDF 產生工具載入失敗，請確認網路後再試一次。'));
        document.head.appendChild(script);
    });
    return loadPdfGenerator.promise;
}

async function savePdfFromPreview(){
    const source = document.getElementById('pdfPreviewPaper');
    if(!source || !pendingPdfReport) return alert('找不到預覽內容，請重新按一次輸出 PDF。');
    try{
        showSaveToast('正在產生 PDF...');
        await loadPdfGenerator();
        const captureWidth = Math.ceil(source.scrollWidth || source.getBoundingClientRect().width || 390);
        const blob = await html2pdf().set({
            margin: 3,
            filename: pendingPdfReport.filename,
            image: {type: 'jpeg', quality: 0.98},
            html2canvas: {scale: 2, useCORS: true, backgroundColor: '#ffffff', windowWidth: captureWidth, scrollY: 0},
            jsPDF: {unit: 'mm', format: [120, 213], orientation: 'portrait'},
            pagebreak: {mode: ['css', 'legacy']}
        }).from(source).outputPdf('blob');
        const file = new File([blob], pendingPdfReport.filename, {type:'application/pdf'});
        if(navigator.canShare && navigator.canShare({files:[file]})){
            await navigator.share({files:[file], title:`Wazi ${pendingPdfReport.month} 報表`});
            showSaveToast('PDF 已開啟分享');
        }else{
            const url = URL.createObjectURL(blob);
            const link = document.createElement('a');
            link.href = url;
            link.download = pendingPdfReport.filename;
            link.target = '_blank';
            document.body.appendChild(link);
            link.click();
            setTimeout(() => {
                URL.revokeObjectURL(url);
                link.remove();
            }, 30000);
            alert('PDF 已產生。如果沒有自動儲存，請在開啟的檔案畫面使用 iPhone 分享鍵，選「儲存到檔案」。');
        }
    }catch(err){
        if(err?.name !== 'AbortError') alert(err?.message || 'PDF 產生失敗，請再試一次。');
    }
}


function vendorDailyAmount(d,name){
 return Object.entries(d.vs||{}).reduce((sum,[key,value])=>{const entry=getVendorEntry(key,value,get('vendors'));return sum+(entry?.name===name?entry.amount:0);},0);
}
function vendorRule(d,name){return d.vendorBilling?.[name]||{cycle:'period',source:'bank'};}
function currentVendorRules(existing={}){
 const rules={...(existing.vendorBilling||{})};get('vendors').forEach(v=>{if(!rules[v.name])rules[v.name]=vendorDailyAmount(existing,v.name)!==0?{cycle:'period',source:'bank'}:{cycle:v.cycle||'period',source:v.source||'bank'};});return rules;
}
function collectVendorValues(){
 const vs={},groups={};document.querySelectorAll('.vd-input').forEach(i=>(groups[i.dataset.name]??=[]).push(i.value));
 for(const [name,values] of Object.entries(groups)){const amounts=values.filter(v=>v!=='').map(num);if(amounts.length)vs[name]=amounts.length===1?amounts[0]:amounts;}
 document.querySelectorAll('.vit-qty').forEach(i=>vs[i.dataset.v+'_'+i.dataset.n+'_'+i.dataset.p]=num(i.value));return vs;
}

function vendorPeriodAmount(name,after,through,draft=null){
 let total=0;const dates=Object.keys(localStorage).filter(k=>k.startsWith(KEY+'d_')).map(k=>k.slice((KEY+'d_').length));if(draft&&!dates.includes(through))dates.push(through);
 for(const date of dates){if(date<=after||date>through)continue;const d=draft&&date===through?draft:JSON.parse(localStorage.getItem(KEY+'d_'+date))||{};if(vendorRule(d,name).cycle!=='daily')total+=vendorDailyAmount(d,name);}
 return total;
}
function vendorBalance(name,asOf){
 const dates=get('vendorSettlements').filter(x=>x.name===name&&x.date<=asOf).map(x=>x.date).sort(),last=dates.at(-1)||'';
 return {last,unpaid:vendorPeriodAmount(name,last,asOf)};
}
function vendorCashPaid(d,date=d.date||''){
 let amount=0;for(const [name,rule] of Object.entries(d.vendorBilling||{})){if(rule.cycle==='daily'&&rule.source==='cash')amount+=vendorDailyAmount(d,name);}
 for(const entry of get('vendorSettlements').filter(x=>x.date===date&&x.source==='cash')){
  const after=get('vendorSettlements').filter(x=>x.name===entry.name&&x.date<date).map(x=>x.date).sort().at(-1)||'';
  amount+=vendorPeriodAmount(entry.name,after,date,d);
 }
 return amount;
}

}

    }
    const existing = editingMiscIndex !== null ? (dailyMisc[editingMiscIndex] || {}) : {};
    const next = {name, amount, unpaid, payer, settled: unpaid ? !!existing.settled : false};
    if(existing.settledAt && next.settled) next.settledAt = existing.settledAt;
    if(editingMiscIndex !== null) dailyMisc[editingMiscIndex] = next;

function showLiveCalc(type){
    const c = cfg();
    const input = document.getElementById('m'+type);
    const rawValue = input?.value ?? '';
    const cur = parseFloat(rawValue) || 0;
    const month = document.getElementById('mMonth').value;
    const savedMonth = getMonthlyData(month);
    const base = getMonthlyCalcBase(savedMonth, c);
    const startKey = {e110:'i110',e220:'i220',se110:'is110',se220:'is220',w:'iw',g:'ig'}[type];
    const start = num(base.start[startKey]);
    const hint = document.getElementById('hint_'+type);
    if(rawValue === ''){
        if(hint) hint.innerText = `基準: ${start}，請輸入結束度數`;
        scheduleMonthlyAutosave();
        return;
    }
    const diff = Math.max(0, cur - start);
    const rate = type.includes('e') ? base.rates.ue : (type==='w' ? base.rates.uw : base.rates.ug);
    const amt = diff * rate;
    if(hint) hint.innerText = `用量: ${diff.toFixed(1)} × ${unitMoney(rate)} | 預估: $${Math.round(amt)}`;
    scheduleMonthlyAutosave();
}
let reconRows=[];
function reconRowId(date,key,index){return encodeURIComponent(JSON.stringify([date,key,index]));}
function buildReconRows(month,names){
 const rows=[],vendors=get('vendors');for(let day=1;day<=31;day++){
  const date=month+'-'+String(day).padStart(2,'0'),d=JSON.parse(localStorage.getItem(KEY+'d_'+date));if(!d)continue;
  for(const [key,value] of Object.entries(d.vs||{})){
   const entry=getVendorEntry(key,value,vendors);if(!entry||!names.includes(entry.name))continue;
   const item=key!==entry.name,price=item?num(key.slice(key.lastIndexOf('_')+1)):1;
   (Array.isArray(value)?value:[value]).forEach((raw,index)=>{if(raw===''||raw==null||num(raw)===0)return;rows.push({id:reconRowId(date,key,index),date,key,index,name:entry.name,label:item?key.slice(entry.name.length+1,key.lastIndexOf('_')):'金額',item,price,raw:num(raw),amount:num(raw)*price});});
  }
 }return rows;
}
function renderRecon(){
 const selected=Array.from(document.querySelectorAll('.recon-chk:checked')).map(x=>x.value),vendors=get('vendors');
 document.getElementById('reconVendorList').innerHTML=vendors.map(v=>`<label class="check-row"><input type="checkbox" class="recon-chk" value="${escapeHtml(v.name)}" ${selected.includes(v.name)?'checked':''} onchange="calcRecon()">${escapeHtml(v.name)}</label>`).join('')||'請先新增廠商';calcRecon();
}
function calcRecon(){
 const names=Array.from(document.querySelectorAll('.recon-chk:checked')).map(x=>x.value),month=document.getElementById('reconMonth').value;
 if(!names.length){document.getElementById('reconDetailArea').innerHTML='選擇廠商';document.getElementById('reconSummaryArea').style.display='none';document.getElementById('reconAction').style.display='none';reconRows=[];return;}
 reconRows=buildReconRows(month,names);
 document.getElementById('reconDetailArea').innerHTML=`<div class="card"><div class="recon-toolbar"><label><input type="checkbox" id="reconSelectAll" onchange="selectAllRecon(this.checked)">全選</label><b id="reconSelectedTotal">已選 0 筆 · $0</b></div><div class="recon-toolbar"><button class="btn btn-primary" onclick="editSelectedRecon()">修改</button><button class="btn btn-danger" onclick="deleteSelectedRecon()">刪除</button><button class="btn btn-info" onclick="undoReconChange()">復原</button></div><div id="reconEditHint" class="report-note" style="display:none">金額或數量修改後，按儲存。</div><button id="reconSaveEdits" class="btn btn-success" style="display:none" onclick="saveSelectedRecon()">儲存修改</button>${reconRows.map(r=>`<div class="recon-row"><input type="checkbox" class="recon-row-check" data-id="${r.id}" onchange="updateReconSelection()"><span>${r.date.slice(5)} ${escapeHtml(r.name)}<br><small>${escapeHtml(r.label)}${r.item?' · '+r.raw+' × '+money(r.price):''}</small><input type="number" class="recon-edit-value" data-id="${r.id}" value="${r.raw}" min="0" inputmode="decimal" style="display:none"></span><b>${money(r.amount)}</b></div>`).join('')||'<div class="report-note">本月沒有明細</div>'}</div>`;
 const cutoff=month+'-'+String(new Date(...[...month.split('-').map(Number),0]).getDate()).padStart(2,'0');
 document.getElementById('reconSummaryArea').innerHTML='<b>未結清（含前月）</b>'+names.map(name=>`<div class="list-row"><span>${escapeHtml(name)}</span><b>${money(vendorBalance(name,cutoff).unpaid)}</b></div>`).join('');document.getElementById('reconSummaryArea').style.display='block';
 document.getElementById('reconAction').style.display='block';document.getElementById('addReconVendor').innerHTML=names.map(name=>`<option>${escapeHtml(name)}</option>`).join('');document.getElementById('addReconDate').value=month+'-01';
}
function selectedReconRows(){const ids=new Set(Array.from(document.querySelectorAll('.recon-row-check:checked')).map(x=>x.dataset.id));return reconRows.filter(r=>ids.has(r.id));}
function updateReconSelection(){
 const rows=selectedReconRows();document.getElementById('reconSelectedTotal').textContent='已選 '+rows.length+' 筆 · '+money(rows.reduce((sum,r)=>sum+r.amount,0));
 const all=document.getElementById('reconSelectAll');if(all){all.checked=rows.length>0&&rows.length===reconRows.length;all.indeterminate=rows.length>0&&rows.length<reconRows.length;}
}
function selectAllRecon(checked){document.querySelectorAll('.recon-row-check').forEach(x=>x.checked=checked);updateReconSelection();}
function editSelectedRecon(){
 const rows=selectedReconRows();if(!rows.length){showSaveToast('請先勾選明細');return;}const ids=new Set(rows.map(r=>r.id));
 document.querySelectorAll('.recon-edit-value').forEach(x=>x.style.display=ids.has(x.dataset.id)?'block':'none');document.getElementById('reconSaveEdits').style.display='block';document.getElementById('reconEditHint').style.display='block';

function applyReconChange(rows,transform){
 clearTimeout(scheduleDailyAutosave.timer);
 const before={},after={};for(const row of rows){if(!before[row.date])before[row.date]=localStorage.getItem(KEY+'d_'+row.date);}
 const data=Object.fromEntries(Object.entries(before).map(([date,raw])=>[date,JSON.parse(raw)||{vs:{}}]));
 transform(data);for(const [date,d] of Object.entries(data)){after[date]=JSON.stringify(d);localStorage.setItem(KEY+'d_'+date,after[date]);}
 const history=get('reconHistory');history.push({before,after});set('reconHistory',history.slice(-20));calcRecon();loadDaily();if(document.getElementById('rMonth').value)genFullReport();
}
function setReconValue(d,row,value,remove=false){
 const raw=d.vs?.[row.key];if(Array.isArray(raw)){if(remove)raw.splice(row.index,1);else raw[row.index]=value;if(!raw.length)delete d.vs[row.key];}
 else if(remove)delete d.vs[row.key];else d.vs[row.key]=value;
}
function saveSelectedRecon(){
 const inputs=Array.from(document.querySelectorAll('.recon-edit-value')).filter(x=>x.style.display==='block'),changes=inputs.map(i=>({row:reconRows.find(r=>r.id===i.dataset.id),value:Number(i.value)}));
 if(!changes.length||changes.some(x=>!Number.isFinite(x.value)||x.value<0)){showSaveToast('請輸入有效金額或數量');return;}
 applyReconChange(changes.map(x=>x.row),data=>changes.forEach(x=>setReconValue(data[x.row.date],x.row,x.value)));showSaveToast('已修改');
}
function deleteSelectedRecon(){const rows=selectedReconRows();if(!rows.length){showSaveToast('請先勾選明細');return;}applyReconChange(rows,data=>[...rows].sort((a,b)=>b.index-a.index).forEach(r=>setReconValue(data[r.date],r,0,true)));showSaveToast('已刪除，可按復原');}
function undoReconChange(){
 const history=get('reconHistory'),last=history.at(-1);if(!last){showSaveToast('沒有可復原的變更');return;}
 if(Object.entries(last.after).some(([date,raw])=>localStorage.getItem(KEY+'d_'+date)!==raw)){showSaveToast('資料已有後續修改，無法直接復原');return;}
 for(const [date,raw] of Object.entries(last.before)){if(raw===null)localStorage.removeItem(KEY+'d_'+date);else localStorage.setItem(KEY+'d_'+date,raw);}
 history.pop();set('reconHistory',history);calcRecon();loadDaily();genFullReport();showSaveToast('已復原');
}
function addReconEntry(){
 const date=document.getElementById('addReconDate').value,name=document.getElementById('addReconVendor').value,raw=document.getElementById('addAmt').value,amount=Number(raw);
 if(!/^\d{4}-\d{2}-\d{2}$/.test(date)||date.slice(0,7)!==document.getElementById('reconMonth').value||!get('vendors').some(v=>v.name===name)||raw===''||!Number.isFinite(amount)||amount<=0){showSaveToast('請選本月日期並輸入正確金額');return;}
 applyReconChange([{date}],data=>{const d=data[date],rules=currentVendorRules(d);d.vs=d.vs||{};const old=d.vs[name];d.vs[name]=old==null?amount:[...(Array.isArray(old)?old:[old]),amount];d.date=date;d.vendorBilling=rules;});document.getElementById('addAmt').value='';showSaveToast('已新增');
}

function backupData(){ const d={}; Object.keys(localStorage).forEach(k=>{ if(k.startsWith(KEY)) d[k]=localStorage.getItem(k); }); const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([JSON.stringify(d)],{type:'application/json'})); a.download=`Wazi_Backup.json`; a.click(); }
function importData(event) {
    const file = event.target.files[0];
    const reader = new FileReader();
    reader.onload = function(e) {
        try {
            const data = JSON.parse(e.target.result);
            if (confirm("確定要匯入備份嗎？目前的資料將會被取代！")) {
                Object.keys(localStorage).forEach(k => { if(k.startsWith(KEY)) localStorage.removeItem(k); });
                for (const k in data) { localStorage.setItem(k, data[k]); }
                location.reload();
            }
        } catch (err) { alert("匯入失敗"); }
    };
    reader.readAsText(file);
}

function purgeVendorHistory(vendorName){
    set('vendorSettlements',get('vendorSettlements').filter(x=>x.name!==vendorName));
    Object.keys(localStorage).forEach(key => {
        if(!key.startsWith(KEY+'d_')) return;
        const daily = JSON.parse(localStorage.getItem(key)) || {};
        if(!daily.vs) return;
        let changed = false;
        Object.keys(daily.vs).forEach(entry => {
            if(entry === vendorName || entry.startsWith(vendorName+'_')){
                delete daily.vs[entry];
                changed = true;
            }
        });
        if(changed) localStorage.setItem(key, JSON.stringify(daily));
    });
}
function del(k,i){
    const d=get(k);
    if(k === 'vendors'){
        const vendor = d[i];
        if(!vendor) return;
        if(!confirm(`確定刪除廠商「${vendor.name}」？\n\n此廠商所有每日記帳與報表進貨紀錄也會一併刪除。`)) return;
        purgeVendorHistory(vendor.name);
    }
    d.splice(i,1);
    set(k,d);
    refreshAfterPeopleOrVendorChange();
}
