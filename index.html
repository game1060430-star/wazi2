<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Wazi 管理系統 V23.10</title>
    <style>
        * { box-sizing: border-box; font-family: "Microsoft JhengHei", sans-serif; }
        :root {
            --bg: #f3f5f2;
            --card: #ffffff;
            --text: #26322d;
            --muted: #728078;
            --line: #e2e8e1;
            --primary: #4f7d5f;
            --primary-dark: #356247;
            --accent: #bf6f45;
            --danger: #c94f4f;
            --info: #3c7f99;
        }
        body { background: var(--bg); margin: 0; padding: 10px; color: var(--text); font-size: 14px; }
        .container { max-width: 850px; margin: 0 auto; }
        .card { background: var(--card); border: 1px solid rgba(53,98,71,0.08); border-radius: 10px; padding: 15px; margin-bottom: 12px; box-shadow: 0 4px 14px rgba(38,50,45,0.07); }
        .tabs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 12px; }
        .tab-btn { padding: 12px 2px; background: #e5ebe4; border: 1px solid #d8e1d6; border-radius: 8px; color: var(--text); font-weight: bold; cursor: pointer; font-size: 13px; transition: 0.2s; }
        .tab-btn.active { background: var(--primary); border-color: var(--primary); color: white; box-shadow: 0 3px 10px rgba(79,125,95,0.25); }
        .tab-btn.refresh-btn { background: var(--info); border-color: var(--info); color: white; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        .date-picker-wrap { background: #e5ebe4; border-radius: 10px; padding: 10px; display: flex; justify-content: center; align-items: center; margin-bottom: 12px; border: 1px solid #d8e1d6; }
        .date-picker-wrap input { background: transparent; border: none; font-size: 18px; font-weight: bold; text-align: center; width: 100%; outline: none; cursor: pointer; color: var(--text); }
        .form-group { margin-bottom: 10px; }
        .form-group label { display: block; font-size: 11px; color: var(--muted); margin-bottom: 4px; font-weight: bold; }
        .form-group input, .form-group select, .form-group textarea { width: 100%; padding: 10px; border: 1px solid var(--line); border-radius: 8px; font-size: 16px; text-align: center; background: #fbfcfb; color: var(--text); }
        .form-group input:focus, .form-group select:focus, .form-group textarea:focus { outline: 2px solid rgba(79,125,95,0.22); border-color: var(--primary); background: #fff; }
        .form-group textarea { min-height: 84px; resize: vertical; text-align: left; }
        .check-row { display: flex; align-items: center; gap: 8px; min-height: 42px; font-weight: bold; color: var(--text); }
        .check-row input { width: 20px; height: 20px; accent-color: var(--primary); }
        .list-row { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 8px 0; border-bottom: 1px solid #eee; }
        .list-row button { width: auto; min-width: 48px; padding: 6px 10px; margin: 0; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .btn { width: 100%; padding: 12px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; margin-top: 5px; display: flex; align-items: center; justify-content: center; gap: 5px; }
        .btn-success { background: var(--primary); color: white; }
        .btn-primary { background: #4e78b8; color: white; }
        .btn-danger { background: var(--danger); color: white; }
        .btn-warning { background: var(--accent); color: white; }
        .btn-info { background: var(--info); color: white; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 12px; }
        table th, table td { border: 1px solid var(--line); padding: 8px; text-align: center; }
        table th { background: #eef4ec; color: var(--primary-dark); }
        .section-title { border-left: 4px solid var(--primary); padding-left: 8px; margin: 15px 0 10px; font-size: 15px; font-weight: bold; background: #eef4ec; padding: 7px 8px; border-radius: 6px; }
        .profit-box { font-size: 20px; font-weight: bold; text-align: center; padding: 15px; background: var(--primary-dark); color: #fff; border-radius: 8px; margin-top: 10px; }
        .stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 10px; }
        .stat-card { background: #fbfcfb; border: 1px solid var(--line); padding: 10px; border-radius: 8px; text-align: center; }
        .stat-card b { font-size: 16px; color: var(--primary-dark); }
        .calc-hint { font-size: 11px; color: var(--danger); text-align: right; min-height: 15px; font-weight: bold; }
        .total-row { background: #eef4ec; font-weight: bold; }
        .grand-total-row { background: #fff4ee; font-weight: bold; color: #a9472f; }
        .mobile-stack { display: grid; grid-template-columns: 1fr; gap: 8px; }
        .v-row { background: #fff; border: 1px solid var(--line); border-radius: 10px; padding: 10px; box-shadow: 0 2px 8px rgba(38,50,45,0.04); }
        .v-row b { display: block; margin-bottom: 6px; font-size: 13px; text-align: center; }
        .vendor-item-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
        .vendor-item-grid label { display: block; margin-bottom: 4px; color: var(--muted); font-size: 11px; font-weight: bold; text-align: center; }
        .misc-list { margin-top: 8px; }
        .misc-row { display: grid; grid-template-columns: 1fr auto auto auto; gap: 8px; align-items: center; padding: 8px 0; border-bottom: 1px solid #eee; }
        .misc-row button { width: auto; min-width: 48px; padding: 6px 10px; margin: 0; }
        .mode-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 10px; }
        .mode-btn { border: 1px solid var(--line); background: #fbfcfb; color: var(--text); border-radius: 8px; padding: 10px; font-weight: bold; }
        .mode-btn.active { background: var(--primary); color: #fff; border-color: var(--primary); }
        .report-card { overflow: visible; }
        .report-note { color: var(--muted); font-size: 12px; line-height: 1.5; margin: 4px 0 10px; }
        .save-toast { position: fixed; left: 50%; bottom: 18px; transform: translate(-50%, 20px); min-width: 220px; max-width: calc(100% - 32px); padding: 13px 16px; border-radius: 10px; background: var(--primary-dark); color: white; text-align: center; font-weight: bold; box-shadow: 0 8px 24px rgba(38,50,45,0.22); opacity: 0; pointer-events: none; transition: opacity .2s ease, transform .2s ease; z-index: 999; }
        .save-toast.show { opacity: 1; transform: translate(-50%, 0); }
        @media (max-width: 640px) {
            body { padding: 8px; font-size: 15px; }
            .container { max-width: 100%; }
            .card { border-radius: 10px; padding: 12px; margin-bottom: 10px; }
            .tabs { grid-template-columns: repeat(3, 1fr); gap: 6px; position: sticky; top: 0; z-index: 10; background: var(--bg); padding-bottom: 8px; }
            .tab-btn { min-height: 44px; padding: 9px 2px; font-size: 12px; }
            .grid, .stat-grid, #vDailyArea { grid-template-columns: repeat(2, minmax(0, 1fr)) !important; gap: 8px !important; }
            .cash-coin-grid { grid-template-columns: repeat(3, minmax(0, 1fr)) !important; }
            .vendor-item-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
            .form-group input, .form-group select, .form-group textarea, .v-row input { min-height: 48px; font-size: 18px; border-radius: 10px; }
            .btn { min-height: 46px; font-size: 15px; border-radius: 10px; }
            table { font-size: 10px; table-layout: fixed; }
            table th, table td { padding: 6px 3px; word-break: break-word; }
        }
        @media (max-width: 380px) {
            .tabs { grid-template-columns: repeat(2, 1fr); }
            .grid, .stat-grid, #vDailyArea { grid-template-columns: 1fr !important; }
            .vendor-item-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
        }
        @media print {
            body.printing-report * { visibility: hidden; }
            body.printing-report #report, body.printing-report #report * { visibility: visible; }
            body.printing-report #report { display: block !important; position: absolute; left: 0; top: 0; width: 100%; }
            body.printing-report .no-print { display: none !important; }
        }
    </style>
</head>
<body>
<div class="container">
    <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('daily')">每日記帳</button>
        <button class="tab-btn" onclick="switchTab('recon')">對帳中心</button>
        <button class="tab-btn" onclick="switchTab('report')">報表中心</button>
        <button class="tab-btn" onclick="switchTab('monthly')">月結算</button>
        <button class="tab-btn" onclick="switchTab('settings')">設定/資料</button>
        <button class="tab-btn refresh-btn" onclick="location.reload()">🔄 重新整理</button>
    </div>

    <div id="daily" class="tab-content active">
        <div class="date-picker-wrap"><input type="date" id="logDate" onchange="loadDaily()"></div>
        <div class="card">
            <h4 style="margin:0 0 10px;">💰 今日收銀</h4>
            <div class="mode-row">
                <button type="button" class="mode-btn active" id="cashModeScaleBtn" onclick="setCashMode('scale')">秤重計算</button>
                <button type="button" class="mode-btn" id="cashModeDirectBtn" onclick="setCashMode('direct')">直接輸入</button>
            </div>
            <div id="cashScaleArea">
            <div class="grid">
                <div class="form-group"><label>千元</label><input type="number" inputmode="decimal" id="c1000" oninput="calcDaily()"></div>
                <div class="form-group"><label>百元</label><input type="number" inputmode="decimal" id="c100" oninput="calcDaily()"></div>
            </div>
            <div class="grid cash-coin-grid" style="grid-template-columns: 1fr 1fr 1fr;">
                <div class="form-group"><label>$50重</label><input type="number" inputmode="decimal" id="w50" oninput="calcDaily()"></div>
                <div class="form-group"><label>$10重</label><input type="number" inputmode="decimal" id="w10" oninput="calcDaily()"></div>
                <div class="form-group"><label>$5重</label><input type="number" inputmode="decimal" id="w5" oninput="calcDaily()"></div>
            </div>
            </div>
            <div id="cashDirectArea" style="display:none;">
                <div class="form-group"><label>現金營業額</label><input type="number" inputmode="decimal" id="cashDirect" oninput="calcDaily()"></div>
            </div>
            <div class="grid">
                <div class="form-group" id="onlinePayGroup"><label>網路收入</label><input type="number" inputmode="decimal" id="pOnline" oninput="calcDaily()"></div>
                <div class="form-group" id="scanPayGroup"><label>掃碼支付</label><input type="number" inputmode="decimal" id="pScan" oninput="calcDaily()"></div>
            </div>
            <div style="text-align:right; font-size:15px; font-weight:bold; color:#764ba2;">今日營業額: <span id="cSumDisplay">$0</span></div>
        </div>
        <h4 class="section-title">📦 廠商進貨</h4>
        <div id="vDailyArea" style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px;"></div>
        <div class="card">
            <h4 style="margin:0 0 10px;">雜支</h4>
            <div class="grid">
                <div class="form-group"><label>品名</label><input type="text" id="miscName" placeholder="例如：臨時用品"></div>
                <div class="form-group"><label>金額</label><input type="number" inputmode="numeric" pattern="[0-9]*" id="miscAmount" placeholder="金額"></div>
                <label class="check-row"><input type="checkbox" id="miscUnpaid" onchange="toggleMiscPayer()">未支付 / 代墊</label>
                <div class="form-group" id="miscPayerWrap" style="display:none;"><label>代墊人</label><select id="miscPayer"></select></div>
            </div>
            <button class="btn btn-primary" id="miscSubmitBtn" onclick="addMiscExpense()">+ 新增雜支</button>
            <button class="btn btn-warning" id="miscCancelEditBtn" style="display:none;" onclick="cancelMiscEdit()">取消編輯</button>
            <div id="miscList" class="misc-list"></div>
        </div>
        <button class="btn btn-success" style="margin-top:15px;" onclick="saveDaily()">✅ 儲存今日數據</button>
    </div>

    <div id="recon" class="tab-content">
        <div class="date-picker-wrap"><input type="month" id="reconMonth" onchange="renderRecon()"></div>
        <div style="display: flex; gap: 10px;">
            <div class="card" id="reconVendorList" style="width: 140px; font-size:12px; max-height: 400px; overflow-y: auto; padding:5px;"></div>
            <div id="reconDetailArea" style="flex: 1;"></div>
        </div>
        <div id="reconSummaryArea" class="card" style="display:none; background: #fffbe6;"></div>
        <div id="reconAction" class="card" style="display:none;">
            <h4 style="margin:0 0 5px;">➕ 手動補錄 (單選廠商時可用)</h4>
            <div class="grid"><input type="number" inputmode="decimal" id="addDay" placeholder="日期(號)"><input type="number" inputmode="decimal" id="addAmt" placeholder="金額"></div>
            <button class="btn btn-primary" onclick="manualUpdateVendorTotal()">確認修改</button>
        </div>
    </div>

    <div id="report" class="tab-content">
        <div class="date-picker-wrap"><input type="month" id="rMonth" onchange="genFullReport()"></div>
        <div id="repArea"></div>
        <button class="btn btn-info no-print" style="margin-top:15px;" onclick="exportReportPdf()">輸出 PDF</button>
        <div id="souffleArea"></div>
    </div>

    <div id="monthly" class="tab-content">
        <div class="date-picker-wrap"><input type="month" id="mMonth" onchange="loadMonthly()"></div>
        <div id="mStartSummary" class="card report-note"></div>
        <div class="card">
            <h4 class="section-title">抄表結束度數</h4>
            <div class="grid">
                <div class="form-group"><label>總表110</label><input type="number" inputmode="decimal" id="me110" oninput="showLiveCalc('e110')"><div id="hint_e110" class="calc-hint"></div></div>
                <div class="form-group"><label>總表220</label><input type="number" inputmode="decimal" id="me220" oninput="showLiveCalc('e220')"><div id="hint_e220" class="calc-hint"></div></div>
                <div class="form-group"><label>水費抄表</label><input type="number" inputmode="decimal" id="mw" oninput="showLiveCalc('w')"><div id="hint_w" class="calc-hint"></div></div>
                <div class="form-group"><label>瓦斯抄表</label><input type="number" inputmode="decimal" id="mg" oninput="showLiveCalc('g')"><div id="hint_g" class="calc-hint"></div></div>
                <div class="form-group"><label>房租</label><input type="number" inputmode="decimal" id="mrent"></div>
                <div class="form-group"><label>公攤額</label><input type="number" inputmode="decimal" id="mpub"></div>
                <div class="form-group"><label>稅金基數</label><input type="number" inputmode="decimal" id="mtaxb"></div>
            </div>
            <h4 class="section-title">自訂固定支出</h4>
            <div id="mFixedArea" class="grid"></div>
            <h4 class="section-title">未支付雜支結算</h4>
            <div id="mUnpaidMiscArea"></div>
            <h4 class="section-title">👥 薪資獎金</h4>
            <div id="mStaffArea"></div>
            <div id="subleaseMonthlySection">
            <h4 class="section-title">分租報表</h4>
            <div class="grid">
                <div class="form-group"><label>分租電表110</label><input type="number" inputmode="decimal" id="mse110" oninput="showLiveCalc('se110')"><div id="hint_se110" class="calc-hint"></div></div>
                <div class="form-group"><label>分租電表220</label><input type="number" inputmode="decimal" id="mse220" oninput="showLiveCalc('se220')"><div id="hint_se220" class="calc-hint"></div></div>
                <div class="form-group"><label>分租租金</label><input type="number" inputmode="decimal" id="msouffleRent" value="15000"></div>
                <div class="form-group"><label>營業額稅金基數</label><input type="number" inputmode="decimal" id="msouffleRevenue"></div>
            </div>
            </div>
            <button class="btn btn-success" style="margin-top:15px;" onclick="saveMonthlyOnly()">💾 儲存本月報表數據</button>
        </div>
    </div>

    <div id="settings" class="tab-content">
        <div class="card">
            <h4 class="section-title">單價與零用金</h4>
            <div class="grid">
                <div class="form-group"><label>電單價</label><input type="number" id="upElec"></div>
                <div class="form-group"><label>水單價</label><input type="number" id="upWater"></div>
                <div class="form-group"><label>瓦斯單價</label><input type="number" id="upGas"></div>
                <div class="form-group"><label>零用金</label><input type="number" id="sPetty"></div>
                <div class="form-group"><label>公攤費比例</label><input type="number" inputmode="decimal" id="sPublicRate"></div>
                <div class="form-group"><label>稅金比例</label><input type="number" inputmode="decimal" id="sTaxRate"></div>
                <label class="check-row"><input type="checkbox" id="sShowOnlinePay">顯示網路收入</label>
                <label class="check-row"><input type="checkbox" id="sShowScanPay">顯示掃碼支付</label>
            </div>
            <h4 class="section-title">上次結算度數</h4>
            <div class="grid">
                <div class="form-group"><label>上次結算月份</label><input type="month" id="sStartMonth"></div>
                <div class="form-group"><label>總110</label><input type="number" id="si110"></div>
                <div class="form-group"><label>總220</label><input type="number" id="si220"></div>
                <div class="form-group"><label>水</label><input type="number" id="siw"></div>
                <div class="form-group"><label>瓦斯</label><input type="number" id="sig"></div>
            </div>
            <button class="btn btn-success" onclick="saveSettings()">💾 儲存基本設定</button>
        </div>
        <div class="card">
            <h4 class="section-title">分租設定</h4>
            <label class="check-row"><input type="checkbox" id="sHasSublease" onchange="toggleSubleaseSettings()">有分租</label>
            <div id="subleaseSettingsFields" class="grid">
                <div class="form-group"><label>分租名稱</label><input type="text" id="sSubleaseName" placeholder="例如：舒芙蕾"></div>
                <div class="form-group"><label>分租租金</label><input type="number" inputmode="decimal" id="sSubleaseRent"></div>
                <div class="form-group"><label>分租分表110</label><input type="number" inputmode="decimal" id="sis110"></div>
                <div class="form-group"><label>分租分表220</label><input type="number" inputmode="decimal" id="sis220"></div>
            </div>
            <button class="btn btn-success" onclick="saveSettings()">💾 儲存分租設定</button>
        </div>
        <div class="card">
            <h4 class="section-title">自訂固定支出</h4>
            <div id="listFixedExpenses"></div>
            <div class="grid">
                <div class="form-group"><label>項目名稱</label><input type="text" id="newFixedName" placeholder="例如：管理費"></div>
                <div class="form-group"><label>預設金額</label><input type="number" inputmode="decimal" id="newFixedAmount"></div>
            </div>
            <button class="btn btn-primary" onclick="addFixedExpense()">+ 新增固定支出</button>
        </div>
        <div class="card">
            <h4 class="section-title">員工</h4>
            <div id="listStaff"></div>
            <div class="grid">
                <div class="form-group"><label>姓名</label><input type="text" id="newStaffName"></div>
                <div class="form-group"><label>時薪</label><input type="number" inputmode="decimal" id="newStaffRate" value="190"></div>
            </div>
            <button class="btn btn-primary" onclick="addStaff()">+ 新增員工</button>
            <hr>
            <h4 class="section-title">廠商</h4>
            <div id="listVendor"></div>
            <div class="grid">
                <div class="form-group"><label>廠商名稱</label><input type="text" id="newVendorName"></div>
                <div class="form-group"><label>模式</label><select id="newVendorType" onchange="toggleVendorItemFields()"><option value="金額">金額</option><option value="品項">品項</option></select></div>
            </div>
            <div id="vendorItemsFields" class="form-group" style="display:none;">
                <label>品項與單價，每行一筆，例如：吐司,35</label>
                <textarea id="newVendorItems" placeholder="吐司,35&#10;漢堡,65"></textarea>
            </div>
            <button class="btn btn-primary" onclick="addVendor()">+ 新增廠商</button>
        </div>
        <h4 class="section-title">🛠 數據維護</h4>
        <div class="grid" style="grid-template-columns: 1fr 1fr;">
            <button class="btn btn-primary" onclick="backupData()">📥 備份數據</button>
            <button class="btn btn-info" onclick="document.getElementById('importFile').click()">📤 匯入數據</button>
            <input type="file" id="importFile" style="display:none" onchange="importData(event)" accept=".json">
            <button class="btn btn-danger" onclick="clearAllData()" style="grid-column: span 2;">⚠️ 清空所有資料</button>
        </div>
    </div>
</div>
<div id="saveToast" class="save-toast">已儲存</div>

<script>
const KEY = "wazi_v23_";
const get = (k)=>JSON.parse(localStorage.getItem(KEY+k)) || [];
const set = (k,v)=>localStorage.setItem(KEY+k, JSON.stringify(v));
const defaultCfg = {petty:8000, i110:0, i220:0, is110:0, is220:0, iw:0, ig:0, ue:5, uw:12, ug:20, startMonth:'', publicRate:0.75, taxRate:0.05, hasSublease:false, subleaseName:'分租', subleaseRent:15000, showOnlinePay:true, showScanPay:true};
const cfg = ()=>Object.assign({}, defaultCfg, JSON.parse(localStorage.getItem(KEY+'cfg')) || {});
let dailyMisc = [];
let editingMiscIndex = null;
let isLoadingDaily = false;
let isLoadingMonthly = false;
const num = (v)=>parseFloat(v) || 0;
const money = (v)=>`$${Math.round(num(v)).toLocaleString()}`;
const unitMoney = (v)=>`$${num(v).toLocaleString(undefined, {maximumFractionDigits: 4})}`;

function currentMonthValue(){
    const now = new Date();
    const tzOffset = now.getTimezoneOffset() * 60000;
    return (new Date(Date.now() - tzOffset)).toISOString().slice(0, 7);
}

function nextMonthValue(month){
    if(!month) return '';
    const [year, monthNum] = month.split('-').map(Number);
    if(!year || !monthNum) return '';
    const next = new Date(year, monthNum, 1);
    return `${next.getFullYear()}-${String(next.getMonth() + 1).padStart(2, '0')}`;
}

function startFromCfg(c){
    return {i110:num(c.i110), i220:num(c.i220), is110:num(c.is110), is220:num(c.is220), iw:num(c.iw), ig:num(c.ig)};
}

function saveStartForMonth(month, start){
    if(month) set('start_'+month, start);
}

function saveLastSettledAsNextStart(c){
    const nextMonth = nextMonthValue(c.startMonth);
    saveStartForMonth(nextMonth || c.startMonth, startFromCfg(c));
    return nextMonth || c.startMonth;
}

function applyStartToMonthlyData(month, start){
    if(!month) return;
    const data = JSON.parse(localStorage.getItem(KEY+'m_'+month)) || {staff:{}, bonus:{}};
    data.start = start;
    set('m_'+month, data);
}

function getSavedStartForMonth(month){
    const start = JSON.parse(localStorage.getItem(KEY+'start_'+month));
    return start && typeof start === 'object' ? start : null;
}

function getStartForMonth(month, c, monthlyData = null){
    if(monthlyData?.start) return monthlyData.start;
    const savedStart = getSavedStartForMonth(month);
    if(savedStart) return savedStart;
    return startFromCfg(c);
}

function initApp(){
    const now = new Date();
    const tzOffset = now.getTimezoneOffset() * 60000;
    const localISO = (new Date(Date.now() - tzOffset)).toISOString();
    document.getElementById('logDate').value = localISO.slice(0, 10);
    document.getElementById('reconMonth').value = localISO.slice(0, 7);
    document.getElementById('rMonth').value = localISO.slice(0, 7);
    document.getElementById('mMonth').value = localISO.slice(0, 7);
    setupNumericKeyboards();
    loadDaily(); renderRecon(); loadMonthly();
}

function setupNumericKeyboards(){
    document.querySelectorAll('input[type="number"]').forEach(input => {
        input.setAttribute('inputmode', 'decimal');
        input.setAttribute('pattern', '[0-9.]*');
        input.setAttribute('enterkeyhint', 'done');
        input.setAttribute('autocomplete', 'off');
        input.setAttribute('step', 'any');
    });
}

function getMonthlyData(month){
    const data = JSON.parse(localStorage.getItem(KEY+'m_'+month)) || {staff:{}, bonus:{}, e110:0, e220:0, se110:0, se220:0, w:0, g:0, pub:0, rent:0, taxb:0, lease:0};
    if(!data.start) data.start = getStartForMonth(month, cfg(), data);
    return data;
}

function getMonthlyCalcBase(m, c, month = ''){
    return {
        start: getStartForMonth(month, c, m),
        rates: m.pdfLocked && m.rates ? m.rates : {ue:c.ue, uw:c.uw, ug:c.ug}
    };
}

function renderMonthlyStartSummary(month, m, c){
    const box = document.getElementById('mStartSummary');
    if(!box) return;
    const base = getMonthlyCalcBase(m, c, month);
    const start = base.start || {};
    const subleaseMeters = c.hasSublease ? `　分租110: ${num(start.is110)}　分租220: ${num(start.is220)}` : '';
    box.innerHTML = `<b>${month || '本月'} 計算基準</b><br>總110: ${num(start.i110)}　總220: ${num(start.i220)}　水: ${num(start.iw)}　瓦斯: ${num(start.ig)}${subleaseMeters}`;
}

function getFixedExpenses(){
    return get('fixedExpenses').map((item, index) => ({
        id: item.id || `legacy_${index}`,
        name: item.name || `固定支出${index + 1}`,
        amount: num(item.amount),
        enabled: item.enabled !== false
    }));
}

function getEnabledFixedExpenses(){
    return getFixedExpenses().filter(item => item.enabled !== false);
}

function getMiscPayers(){
    const names = get('staff').map(s => s.n).concat('其他');
    return [...new Set(names.filter(Boolean))];
}

function isMiscSettled(item){
    return !item.unpaid || item.settled;
}

function getUnpaidMiscEntries(month){
    const entries = [];
    for(let i=1; i<=31; i++){
        const date = month + '-' + String(i).padStart(2,'0');
        const d = JSON.parse(localStorage.getItem(KEY+'d_'+date));
        (d?.misc || []).forEach((item, index) => {
            if(item.unpaid && !item.settled) entries.push({date, index, item});
        });
    }
    return entries;
}

function lockMonthlyRatesForPdf(month){
    const c = cfg();
    const m = getMonthlyData(month);
    if(!confirm(`輸出 PDF 前請確認本月單價無誤：\n\n電單價：${unitMoney(c.ue)}\n水單價：${unitMoney(c.uw)}\n瓦斯單價：${unitMoney(c.ug)}\n\n確認後會鎖定 ${month} 的水電瓦斯單價，之後設定頁改單價也不會影響這個月份。\n\n確定要輸出 PDF 嗎？`)) return false;
    m.rates = {ue:num(c.ue), uw:num(c.uw), ug:num(c.ug)};
    m.pdfLocked = true;
    set('m_'+month, m);
    return true;
}

function getFixedExpenseRows(m, c){
    const {start, rates} = getMonthlyCalcBase(m, c);
    const publicRate = num(m.publicRate ?? c.publicRate);
    const taxRate = num(m.taxRate ?? c.taxRate);
    const e110Use = Math.max(0, num(m.e110) - num(start.i110));
    const e220Use = Math.max(0, num(m.e220) - num(start.i220));
    const se110Use = c.hasSublease ? Math.max(0, num(m.se110) - num(start.is110)) : 0;
    const se220Use = c.hasSublease ? Math.max(0, num(m.se220) - num(start.is220)) : 0;
    const eNet = Math.max(0, e110Use + e220Use - se110Use - se220Use);
    const waterUse = Math.max(0, num(m.w) - num(start.iw));
    const gasUse = Math.max(0, num(m.g) - num(start.ig));
    const baseRows = [
        {label:'房租', detail:'月租金', amount:num(m.rent)},
        {label:'公攤', detail:`本月金額 ${money(m.pub)} × 設定乘數 ${publicRate}`, amount:num(m.pub) * publicRate},
        {label:'電費', detail:`總110 ${num(start.i110)}→${num(m.e110)}，總220 ${num(start.i220)}→${num(m.e220)}，分表扣 ${se110Use.toFixed(1)}+${se220Use.toFixed(1)}，實用 ${eNet.toFixed(1)} 度 × ${unitMoney(rates.ue)}`, amount:eNet * num(rates.ue)},
        {label:'水費', detail:`${num(start.iw)}→${num(m.w)}，用量 ${waterUse.toFixed(1)} 度 × ${unitMoney(rates.uw)}`, amount:waterUse * num(rates.uw)},
        {label:'瓦斯', detail:`${num(start.ig)}→${num(m.g)}，用量 ${gasUse.toFixed(1)} 度 × ${unitMoney(rates.ug)}`, amount:gasUse * num(rates.ug)},
        {label:'稅金', detail:`本月基數 ${money(m.taxb)} × 設定比例 ${taxRate}`, amount:num(m.taxb) * taxRate}
    ];
    const customRows = getEnabledFixedExpenses().map(item => ({
        label:item.name,
        detail:`設定金額 ${money(item.amount)}，本月採用 ${money(m.fixed?.[item.id] ?? item.amount)}`,
        amount:num(m.fixed?.[item.id] ?? item.amount)
    }));
    return baseRows.concat(customRows);
}

function getSouffleExpenseRows(m, c){
    if(!c.hasSublease) return [];
    const {start, rates} = getMonthlyCalcBase(m, c);
    const publicRate = num(m.publicRate ?? c.publicRate);
    const taxRate = num(m.taxRate ?? c.taxRate);
    const se110Use = Math.max(0, num(m.se110) - num(start.is110));
    const se220Use = Math.max(0, num(m.se220) - num(start.is220));
    const subElectricUse = se110Use + se220Use;
    const waterUse = Math.max(0, num(m.w) - num(start.iw));
    const waterAmount = waterUse * num(rates.uw);
    const pubAmount = num(m.pub) * publicRate;
    const legacySouffle = m.souffle || {};
    const souffle = {
        rent: legacySouffle.rent ?? c.subleaseRent ?? c.souffleRent ?? 15000,
        revenue: legacySouffle.revenue ?? c.souffleRevenue ?? 0
    };
    return [
        {label:'租金', detail:'本月舒芙蕾租金', amount:num(souffle.rent)},
        {label:'電費', detail:`舒芙蕾分表 ${se110Use.toFixed(1)} + ${se220Use.toFixed(1)} = ${subElectricUse.toFixed(1)} 度 × 店裡電單價 ${unitMoney(rates.ue)}`, amount:subElectricUse * num(rates.ue)},
        {label:'水費', detail:`同主報表水費：${waterUse.toFixed(1)} 度 × ${unitMoney(rates.uw)}`, amount:waterAmount},
        {label:'公攤費', detail:`同主報表公攤：${money(m.pub)} × ${publicRate}`, amount:pubAmount},
        {label:'營業額稅金', detail:`${money(souffle.revenue)} × ${taxRate}`, amount:num(souffle.revenue) * taxRate}
    ];
}

function switchTab(id){
    document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
    document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
    document.getElementById(id).classList.add('active');
    const btn = document.querySelector(`.tab-btn[onclick*="${id}"]`);
    if(btn) btn.classList.add('active');
    if(id==='report') genFullReport();
    if(id==='monthly') loadMonthly();
    if(id==='settings') renderSettings();
}

function calcDaily(){
    const c = cfg(); 
    const val = (id)=>parseFloat(document.getElementById(id).value) || 0;
    const cashMode = document.getElementById('cashDirectArea')?.style.display === 'block' ? 'direct' : 'scale';
    const paymentIds = ['c1000','c100','w50','w10','w5','cashDirect','pOnline','pScan'];
    const hasInput = paymentIds.some(id=>document.getElementById(id)?.value !== '');
    if(!hasInput) { document.getElementById('cSumDisplay').innerText = `$ 0`; return; }
    const cashRaw = (val('c1000')*1000) + (val('c100')*100) + (Math.max(0, val('w50')-26)*5) + (Math.max(0, val('w10')-26)*1.33) + (Math.max(0, val('w5')-26)*1.1);
    const cash = cashMode === 'direct' ? val('cashDirect') : (cashRaw - c.petty);
    const online = c.showOnlinePay ? val('pOnline') : 0;
    const scan = c.showScanPay ? val('pScan') : 0;
    const result = cash + online + scan;
    document.getElementById('cSumDisplay').innerText = `$ ${Math.round(result).toLocaleString()}`;
    scheduleDailyAutosave();
}

function setCashMode(mode){
    const direct = mode === 'direct';
    document.getElementById('cashScaleArea').style.display = direct ? 'none' : 'block';
    document.getElementById('cashDirectArea').style.display = direct ? 'block' : 'none';
    document.getElementById('cashModeScaleBtn').classList.toggle('active', !direct);
    document.getElementById('cashModeDirectBtn').classList.toggle('active', direct);
    calcDaily();
}

function applyPaymentVisibility(){
    const c = cfg();
    const online = document.getElementById('onlinePayGroup');
    const scan = document.getElementById('scanPayGroup');
    if(online) online.style.display = c.showOnlinePay ? 'block' : 'none';
    if(scan) scan.style.display = c.showScanPay ? 'block' : 'none';
}

function getDailyRevenue(d, c){
    const val = (v)=>parseFloat(v)||0;
    const cashOnly = (val(d.c1000)*1000) + (val(d.c100)*100) + (Math.max(0, val(d.w50)-26)*5) + (Math.max(0, val(d.w10)-26)*1.33) + (Math.max(0, val(d.w5)-26)*1.1);
    const cash = d.cashMode === 'direct' ? val(d.cashDirect) : (cashOnly - c.petty);
    const online = c.showOnlinePay ? val(d.pOnline) : 0;
    const scan = c.showScanPay ? val(d.pScan) : 0;
    return {cash, online, scan, total: cash + online + scan};
}

function showSaveToast(message){
    const toast = document.getElementById('saveToast');
    if(!toast) return;
    toast.innerText = message;
    toast.classList.add('show');
    clearTimeout(showSaveToast.timer);
    showSaveToast.timer = setTimeout(() => toast.classList.remove('show'), 1800);
}

function scheduleDailyAutosave(){
    if(isLoadingDaily) return;
    clearTimeout(scheduleDailyAutosave.timer);
    scheduleDailyAutosave.timer = setTimeout(() => saveDaily(true), 700);
}

function scheduleMonthlyAutosave(){
    if(isLoadingMonthly) return;
    clearTimeout(scheduleMonthlyAutosave.timer);
    scheduleMonthlyAutosave.timer = setTimeout(() => saveMonthlyData(true), 900);
}

function bindMonthlyAutosave(){
    document.querySelectorAll('#monthly input[type="number"]').forEach(input => {
        if(input.dataset.monthlyAutosaveBound) return;
        input.dataset.monthlyAutosaveBound = '1';
        input.addEventListener('input', scheduleMonthlyAutosave);
    });
}

function getVendorEntry(entryKey, entryValue, vendors){
    const vendor = vendors
        .filter(v => entryKey === v.name || entryKey.startsWith(v.name+'_'))
        .sort((a,b) => b.name.length - a.name.length)[0];
    if(!vendor) return null;
    if(entryKey === vendor.name) return {name:vendor.name, amount:num(entryValue)};
    const price = num(entryKey.slice(entryKey.lastIndexOf('_') + 1));
    return {name:vendor.name, amount:num(entryValue) * price};
}

function genFullReport(){
    const month = document.getElementById('rMonth').value;
    const m = getMonthlyData(month);
    const c = cfg();
    const activeVendors = get('vendors');
    let dayRows="", tCash=0, tOnline=0, tScan=0, tDays=0, vSum={}, miscRows="", tMisc=0;
    const revenueHead = `<th>日</th><th>現金</th>${c.showOnlinePay ? '<th>網路</th>' : ''}${c.showScanPay ? '<th>掃碼</th>' : ''}<th>總額</th>`;
    const revenueColspan = 3 + (c.showOnlinePay ? 1 : 0) + (c.showScanPay ? 1 : 0);
    for(let i=1; i<=31; i++){
        const date = month + '-' + String(i).padStart(2,'0');
        const d = JSON.parse(localStorage.getItem(KEY+'d_'+date));
        if(d){
            const hasData = [d.c1000, d.c100, d.w50, d.w10, d.w5, d.cashDirect, d.pOnline, d.pScan].some(v=>v!='' && v!=null);
            if(hasData){
                const rev = getDailyRevenue(d, c);
                dayRows += `<tr><td>${i}</td><td>$${Math.round(rev.cash).toLocaleString()}</td>${c.showOnlinePay ? `<td>$${Math.round(rev.online).toLocaleString()}</td>` : ''}${c.showScanPay ? `<td>$${Math.round(rev.scan).toLocaleString()}</td>` : ''}<td>$${Math.round(rev.total).toLocaleString()}</td></tr>`;
                tCash += rev.cash; tOnline += rev.online; tScan += rev.scan; tDays++;
            }
            if(d.vs) for(let k in d.vs){
                const entry = getVendorEntry(k, d.vs[k], activeVendors);
                if(!entry) continue;
                vSum[entry.name] = (vSum[entry.name]||0) + entry.amount;
            }
            (d.misc||[]).forEach(item => {
                const amt = parseFloat(item.amount)||0;
                if(!isMiscSettled(item)) return;
                tMisc += amt;
                const payerNote = item.payer ? ` / 代墊：${item.payer}` : '';
                miscRows += `<tr><td colspan="4" style="text-align:left;">${date.slice(8)}日 ${item.name}${payerNote}</td><td>$${Math.round(amt).toLocaleString()}</td></tr>`;
            });
        }
    }
    const tRev = tCash + tOnline + tScan;
    const tVendor = Object.values(vSum).reduce((a,b)=>a+b, 0);
    let tFixed = 0;
    const fixedRows = getFixedExpenseRows(m, c).map(f=>{
        tFixed += f.amount;
        return `<tr><td colspan="2" style="text-align:left;">${f.label}</td><td colspan="2" style="text-align:left;">${f.detail}</td><td>${money(f.amount)}</td></tr>`;
    }).join('');

    let tStaff = 0;
    const staffHtml = get('staff').map(s => {
        const h = m.staff?.[s.n]||0, b = m.bonus?.[s.n]||0, total = (h*s.r) * (1 + b/100);
        tStaff += total;
        return `<tr><td>${s.n}</td><td>${h}h</td><td>$${s.r}</td><td>${b}%</td><td>$${Math.round(total).toLocaleString()}</td></tr>`;
    }).join('');

    document.getElementById('repArea').innerHTML = `
        <div class="stat-grid">
            <div class="stat-card">本月營業天數<br><b>${tDays}</b></div>
            <div class="stat-card">平均日營業額<br><b>$${tDays>0?Math.round(tRev/tDays).toLocaleString():0}</b></div>
        </div>
        <h4 class="section-title">📅 每日營收</h4>
        <div class="card report-card" style="padding:0"><table><tr>${revenueHead}</tr>${dayRows || `<tr><td colspan="${revenueColspan}">本月尚無每日記帳資料</td></tr>`}<tr class="total-row"><td>總計</td><td>$${Math.round(tCash).toLocaleString()}</td>${c.showOnlinePay ? `<td>$${Math.round(tOnline).toLocaleString()}</td>` : ''}${c.showScanPay ? `<td>$${Math.round(tScan).toLocaleString()}</td>` : ''}<td>$${Math.round(tRev).toLocaleString()}</td></tr></table></div>
        <h4 class="section-title">📦 支出與人事</h4>
        <div class="card report-card" style="padding:0"><table><tr><th colspan="4" style="text-align:left;">廠商進貨</th><th>金額</th></tr>${Object.keys(vSum).map(vn => `<tr><td colspan="4" style="text-align:left;">${vn}</td><td>$${Math.round(vSum[vn]).toLocaleString()}</td></tr>`).join('') || '<tr><td colspan="5">無廠商進貨</td></tr>'}<tr class="grand-total-row"><td colspan="4" style="text-align:left;">廠商總計</td><td>$${Math.round(tVendor).toLocaleString()}</td></tr><tr><th colspan="4" style="text-align:left;">雜支</th><th>金額</th></tr>${miscRows || '<tr><td colspan="5">無雜支</td></tr>'}<tr class="grand-total-row"><td colspan="4" style="text-align:left;">雜支總計</td><td>$${Math.round(tMisc).toLocaleString()}</td></tr><tr><th colspan="2" style="text-align:left;">固定支出</th><th colspan="2" style="text-align:left;">計算方式</th><th>金額</th></tr>${fixedRows}<tr class="grand-total-row"><td colspan="4" style="text-align:left;">固定總計</td><td>$${Math.round(tFixed).toLocaleString()}</td></tr><tr><th colspan="4" style="text-align:left;">人事成本</th><th>合計</th></tr>${staffHtml || '<tr><td colspan="5">無人事資料</td></tr>'}<tr class="grand-total-row"><td colspan="4" style="text-align:left;">人事總計</td><td>$${Math.round(tStaff).toLocaleString()}</td></tr></table></div>
        <div class="profit-box">預計純利：$${Math.round(tRev - tVendor - tMisc - tFixed - tStaff).toLocaleString()}</div>`;
    renderSouffleReport(false);
}

function renderSouffleReport(shouldScroll = true){
    const month = document.getElementById('rMonth').value;
    const m = getMonthlyData(month);
    const c = cfg();
    if(!c.hasSublease){
        document.getElementById('souffleArea').innerHTML = '';
        return;
    }
    let total = 0;
    const rows = getSouffleExpenseRows(m, c).map(row => {
        total += row.amount;
        return `<tr><td style="text-align:left;">${row.label}</td><td style="text-align:left;">${row.detail}</td><td>${money(row.amount)}</td></tr>`;
    }).join('');
    const reportName = c.subleaseName || '分租';
    document.getElementById('souffleArea').innerHTML = `
        <h4 class="section-title">${reportName}報表</h4>
        <div class="card report-card" style="padding:0">
            <table>
                <tr><th>項目</th><th>計算方式</th><th>金額</th></tr>
                ${rows}
                <tr class="grand-total-row"><td colspan="2" style="text-align:left;">${reportName}總計</td><td>${money(total)}</td></tr>
            </table>
        </div>`;
    if(shouldScroll) document.getElementById('souffleArea').scrollIntoView({behavior:'smooth', block:'start'});
}

function loadPdfGenerator(){
    if(window.html2pdf) return Promise.resolve();
    if(loadPdfGenerator.promise) return loadPdfGenerator.promise;
    loadPdfGenerator.promise = new Promise((resolve, reject) => {
        const script = document.createElement('script');
        script.src = 'https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js';
        script.onload = resolve;
        script.onerror = () => reject(new Error('PDF 產生工具載入失敗，請確認網路後再試一次。'));
        document.head.appendChild(script);
    });
    return loadPdfGenerator.promise;
}

async function savePdfFromPreview(){
    const source = document.getElementById('pdfPreviewPaper');
    if(!source || !pendingPdfReport) return alert('找不到預覽內容，請重新按一次輸出 PDF。');
    try{
        showSaveToast('正在產生 PDF...');
        await loadPdfGenerator();
        const blob = await html2pdf().set({
            margin: 8,
            filename: pendingPdfReport.filename,
            image: {type: 'jpeg', quality: 0.98},
            html2canvas: {scale: 2, useCORS: true, backgroundColor: '#ffffff', windowWidth: 794, scrollY: 0},
            jsPDF: {unit: 'mm', format: 'a4', orientation: 'portrait'},
            pagebreak: {mode: ['css', 'legacy']}
        }).from(source).outputPdf('blob');
        const file = new File([blob], pendingPdfReport.filename, {type:'application/pdf'});
        if(navigator.canShare && navigator.canShare({files:[file]})){
            await navigator.share({files:[file], title:`Wazi ${pendingPdfReport.month} 報表`});
            showSaveToast('PDF 已開啟分享');
        }else{
            const url = URL.createObjectURL(blob);
            const link = document.createElement('a');
            link.href = url;
            link.download = pendingPdfReport.filename;
            link.target = '_blank';
            document.body.appendChild(link);
            link.click();
            setTimeout(() => {
                URL.revokeObjectURL(url);
                link.remove();
            }, 30000);
            alert('PDF 已產生。如果沒有自動儲存，請在開啟的檔案畫面使用 iPhone 分享鍵，選「儲存到檔案」。');
        }
    }catch(err){
        if(err?.name !== 'AbortError') alert(err?.message || 'PDF 產生失敗，請再試一次。');
    }
}

function showLiveCalc(type){
    const c = cfg();
    const input = document.getElementById('m'+type);
    const rawValue = input?.value ?? '';
    const cur = parseFloat(rawValue) || 0;
    const month = document.getElementById('mMonth').value;
    const savedMonth = getMonthlyData(month);
    const base = getMonthlyCalcBase(savedMonth, c);
    const startKey = {e110:'i110',e220:'i220',se110:'is110',se220:'is220',w:'iw',g:'ig'}[type];
    const start = num(base.start[startKey]);
    const hint = document.getElementById('hint_'+type);
    if(rawValue === ''){
        if(hint) hint.innerText = `基準: ${start}，請輸入結束度數`;
        scheduleMonthlyAutosave();
        return;
    }
    const diff = Math.max(0, cur - start);
    const rate = type.includes('e') ? base.rates.ue : (type==='w' ? base.rates.uw : base.rates.ug);
    const amt = diff * rate;
    if(hint) hint.innerText = `用量: ${diff.toFixed(1)} × ${unitMoney(rate)} | 預估: $${Math.round(amt)}`;
    scheduleMonthlyAutosave();
}

function calcRecon(){
    const chks = document.querySelectorAll('.recon-chk:checked'), month = document.getElementById('reconMonth').value;

    let selectedNames = Array.from(chks).map(c => c.value), vTots = {}, dayDets = {}, totalAll = 0;
    selectedNames.forEach(n => vTots[n] = 0);
    for(let i=1; i<=31; i++){
        const d = JSON.parse(localStorage.getItem(KEY+'d_'+month+'-'+String(i).padStart(2,'0')));
        if(d && d.vs){
            let dayTotal = 0;
            for(let key in d.vs){
                let owner = selectedNames.find(n => key === n || key.startsWith(n + '_'));

    document.getElementById('reconDetailArea').innerHTML = `<table><tr><th>日</th><th>金額</th></tr>${Object.keys(dayDets).map(day => `<tr><td>${day}號</td><td>$${Math.round(dayDets[day]).toLocaleString()}</td></tr>`).join('')}</table>`;

    document.getElementById('reconAction').style.display = (selectedNames.length === 1) ? 'block' : 'none';

function saveSettings(){
    const c = cfg();
    const startMonth = document.getElementById('sStartMonth').value || c.startMonth || currentMonthValue();
    Object.assign(c, {
        ue:parseFloat(document.getElementById('upElec').value)||0,
        uw:parseFloat(document.getElementById('upWater').value)||0,
        ug:parseFloat(document.getElementById('upGas').value)||0,
        petty:parseFloat(document.getElementById('sPetty').value)||0,
        publicRate:parseFloat(document.getElementById('sPublicRate').value)||1,
        taxRate:parseFloat(document.getElementById('sTaxRate').value)||0,
        showOnlinePay:!!document.getElementById('sShowOnlinePay')?.checked,
        showScanPay:!!document.getElementById('sShowScanPay')?.checked,
        hasSublease:!!document.getElementById('sHasSublease')?.checked,
        subleaseName:document.getElementById('sSubleaseName').value.trim() || '分租',
        subleaseRent:parseFloat(document.getElementById('sSubleaseRent').value)||0,
        i110:parseFloat(document.getElementById('si110').value)||0,
        i220:parseFloat(document.getElementById('si220').value)||0,
        is110:parseFloat(document.getElementById('sis110').value)||0,
        is220:parseFloat(document.getElementById('sis220').value)||0,
        iw:parseFloat(document.getElementById('siw').value)||0,
        ig:parseFloat(document.getElementById('sig').value)||0,
        startMonth:startMonth
    });
    set('cfg', c);
    const baseMonth = syncMonthlyBasesFromSettings(c);
    alert('設定已儲存');
    applyPaymentVisibility();
    calcDaily();
    if(document.getElementById('mMonth') && baseMonth) document.getElementById('mMonth').value = baseMonth;
    loadMonthly();
    if(document.getElementById('rMonth')?.value) genFullReport();
}

function syncMonthlyBasesFromSettings(c = cfg()){
    const baseMonth = saveLastSettledAsNextStart(c);
    const start = startFromCfg(c);
    applyStartToMonthlyData(baseMonth, start);
    return baseMonth;
}
function backupData(){ const d={}; Object.keys(localStorage).forEach(k=>{ if(k.startsWith(KEY)) d[k]=localStorage.getItem(k); }); const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([JSON.stringify(d)],{type:'application/json'})); a.download=`Wazi_Backup.json`; a.click(); }
function importData(event) {
    const file = event.target.files[0];
    const reader = new FileReader();
    reader.onload = function(e) {
        try {
            const data = JSON.parse(e.target.result);
            if (confirm("確定要匯入備份嗎？目前的資料將會被取代！")) {
                Object.keys(localStorage).forEach(k => { if(k.startsWith(KEY)) localStorage.removeItem(k); });
                for (const k in data) { localStorage.setItem(k, data[k]); }
                location.reload();
            }
        } catch (err) { alert("匯入失敗"); }
    };
    reader.readAsText(file);
}
function clearAllData(){ if(confirm('⚠️ 確定清空？')){ localStorage.clear(); location.reload(); } }
function renderFixedExpenseSettings(){
    const box = document.getElementById('listFixedExpenses');
    if(!box) return;
    box.innerHTML = getFixedExpenses().map((item,i)=>`<div class="list-row"><label class="check-row" style="flex:1; min-height:0;"><input type="checkbox" ${item.enabled ? 'checked' : ''} onchange="toggleFixedExpense(${i}, this.checked)"> <span>${item.name} (${money(item.amount)})</span></label><button class="btn btn-danger" onclick="delFixedExpense(${i})">刪</button></div>`).join('') || '<div style="color:#888; padding:8px 0;">尚未新增固定支出</div>';
}
function addFixedExpense(){
    const name = document.getElementById('newFixedName').value.trim();
    const amount = parseFloat(document.getElementById('newFixedAmount').value) || 0;
    if(!name){ alert('請輸入固定支出名稱'); return; }
    const items = get('fixedExpenses');
    items.push({id:'fx_'+Date.now(), name:name, amount:amount, enabled:true});
    set('fixedExpenses', items);
    document.getElementById('newFixedName').value = '';
    document.getElementById('newFixedAmount').value = '';
    renderFixedExpenseSettings();
    loadMonthly();
}
function toggleFixedExpense(i, enabled){
    const items = get('fixedExpenses');
    if(!items[i]) return;
    items[i].enabled = enabled;
    set('fixedExpenses', items);
    renderFixedExpenseSettings();
    loadMonthly();
    if(document.getElementById('rMonth')?.value) genFullReport();
}
function delFixedExpense(i){
    const items = get('fixedExpenses');
    items.splice(i, 1);
    set('fixedExpenses', items);
    renderFixedExpenseSettings();
    loadMonthly();
}
function toggleSubleaseSettings(){
    const has = !!document.getElementById('sHasSublease')?.checked;
    const fields = document.getElementById('subleaseSettingsFields');
    if(fields) fields.style.display = has ? 'grid' : 'none';
}
function toggleVendorItemFields(){
    const type = document.getElementById('newVendorType')?.value;
    const box = document.getElementById('vendorItemsFields');
    if(box) box.style.display = type === '品項' ? 'block' : 'none';
}
function refreshAfterPeopleOrVendorChange(){
    renderSettings();
    loadDaily();
    renderRecon();
    loadMonthly();
}
function addStaff(){
    const n = document.getElementById('newStaffName').value.trim();
    const r = parseFloat(document.getElementById('newStaffRate').value) || 0;
    if(!n){ alert('請輸入員工姓名'); return; }
    if(r <= 0){ alert('請輸入正確時薪'); return; }
    const s = get('staff');
    s.push({n:n, r:r});
    set('staff',s);
    document.getElementById('newStaffName').value = '';
    document.getElementById('newStaffRate').value = '190';
    refreshAfterPeopleOrVendorChange();
}
function addVendor(){
    const n = document.getElementById('newVendorName').value.trim();
    const t = document.getElementById('newVendorType').value;
    if(!n){ alert('請輸入廠商名稱'); return; }
    const v = get('vendors');
    const vendor = {name:n, type:t, items:[]};
    if(t === '品項'){
        vendor.items = document.getElementById('newVendorItems').value.split('\n').map(line => {
            const parts = line.split(',').map(s => s.trim());
            return {n:parts[0], p:parseFloat(parts[1]) || 0};
        }).filter(item => item.n && item.p > 0);
        if(vendor.items.length === 0){ alert('品項模式請至少輸入一筆品項與單價'); return; }
    }
    v.push(vendor);
    set('vendors',v);
    document.getElementById('newVendorName').value = '';
    document.getElementById('newVendorType').value = '金額';
    document.getElementById('newVendorItems').value = '';
    refreshAfterPeopleOrVendorChange();
}
function purgeVendorHistory(vendorName){
    Object.keys(localStorage).forEach(key => {
        if(!key.startsWith(KEY+'d_')) return;
        const daily = JSON.parse(localStorage.getItem(key)) || {};
        if(!daily.vs) return;
        let changed = false;
        Object.keys(daily.vs).forEach(entry => {
            if(entry === vendorName || entry.startsWith(vendorName+'_')){
                delete daily.vs[entry];
                changed = true;
            }
        });
        if(changed) localStorage.setItem(key, JSON.stringify(daily));
    });
}
function del(k,i){
    const d=get(k);
    if(k === 'vendors'){
        const vendor = d[i];
        if(!vendor) return;
        if(!confirm(`確定刪除廠商「${vendor.name}」？\n\n此廠商所有每日記帳與報表進貨紀錄也會一併刪除。`)) return;
        purgeVendorHistory(vendor.name);
    }
    d.splice(i,1);
    set(k,d);
    refreshAfterPeopleOrVendorChange();
}
window.addEventListener('load', initApp);
